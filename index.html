  <style>
    :root {
      --bg: #0c0f16;
      --bg-2: #121722;
      --surface: #171d2a;
      --surface-2: #1f2737;
      --surface-3: #2a3346;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.16);
      --text: #eef1f7;
      --text-2: #a4adbf;
      --text-3: #6d778b;

      --accent: #ffc83d;
      --accent-ink: #1a1405;
      --accent-soft: rgba(255,200,61,0.14);

      --ok: #34d399;
      --ok-soft: rgba(52,211,153,0.14);
      --bad: #f87171;
      --bad-soft: rgba(248,113,113,0.14);

      --der: #60a5fa;  --der-soft: rgba(96,165,250,0.14);
      --die: #f472b6;  --die-soft: rgba(244,114,182,0.14);
      --das: #4ade80;  --das-soft: rgba(74,222,128,0.14);

      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --ease: cubic-bezier(.2,.8,.2,1);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f4f5f8;
      --bg-2: #eceef3;
      --surface: #ffffff;
      --surface-2: #f1f3f7;
      --surface-3: #e3e7ee;
      --line: rgba(15,23,42,0.08);
      --line-strong: rgba(15,23,42,0.16);
      --text: #111827;
      --text-2: #4b5567;
      --text-3: #8a93a5;
      --accent: #e0a100;
      --accent-ink: #1a1405;
      --accent-soft: rgba(224,161,0,0.14);
      --ok: #059669;  --ok-soft: rgba(5,150,105,0.12);
      --bad: #dc2626; --bad-soft: rgba(220,38,38,0.1);
      --der: #2563eb; --der-soft: rgba(37,99,235,0.1);
      --die: #db2777; --die-soft: rgba(219,39,119,0.1);
      --das: #16a34a; --das-soft: rgba(22,163,74,0.1);
      --shadow: 0 10px 30px rgba(15,23,42,0.08);
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
    svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px);
    }

    /* ---------- Header ---------- */
    .top { display: flex; align-items: center; gap: 10px; padding: 6px 0 18px; }
    .brand { display: flex; align-items: center; gap: 10px; text-align: left; border-radius: 12px; padding: 2px; margin: -2px; transition: transform .1s; }
    .brand:active { transform: scale(.96); }
    .wrap { overflow-x: hidden; overflow-x: clip; }
    .brand .mark { width: 36px; height: 36px; flex: none; border-radius: 10px; box-shadow: 0 4px 14px rgba(255,200,61,.25); }
    .brand .wm { font-size: 1.22rem; font-weight: 850; letter-spacing: -0.03em; line-height: 1; }
    .brand .wm span { font-weight: 550; color: var(--text-2); }
    @media (max-width: 430px) {
      .top { gap: 6px; }
      .top .icon-btn { width: 34px; height: 34px; border-radius: 11px; }
      .top .chip { padding: 0 9px; height: 34px; }
      .brand { gap: 8px; }
      .brand .mark { width: 32px; height: 32px; }
      .brand .wm { font-size: 1.1rem; }
    }
    @media (max-width: 350px) { .brand .wm { display: none; } }
    .top .spacer { flex: 1; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      font-weight: 700; font-size: .85rem; color: var(--text-2);
    }
    .chip.streak.on { color: var(--accent); }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
      transition: background .15s, color .15s, transform .1s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-2); }
    .icon-btn:active { transform: scale(.94); }

    /* ---------- Chapter card ---------- */
    .chapter-card {
      background: linear-gradient(160deg, var(--surface) 0%, var(--bg-2) 100%);
      border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px; margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .ch-row { display: flex; align-items: center; gap: 10px; }
    .ch-pick { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 4px 6px; margin: -4px -6px; border-radius: 12px; }
    .ch-pick:hover { background: var(--surface-2); }
    .ch-kicker { font-size: .75rem; font-weight: 750; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .ch-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
    .ch-title svg { color: var(--text-3); flex: none; }
    .ch-arrows { display: flex; gap: 6px; }
    .ch-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .lvl { display: inline-flex; align-items: center; gap: 8px; }
    .lvl-label { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .lvl .seg button { padding: 7px 16px; font-size: .88rem; }
    .lvl .seg button.on { background: var(--accent); color: var(--accent-ink); }
    .ch-switch {
      width: 100%; margin-top: 12px; display: flex; align-items: center; gap: 12px; text-align: left;
      padding: 12px 14px; border-radius: var(--r-md); background: var(--accent-soft);
      border: 1.5px dashed var(--accent); color: var(--text); transition: background .15s, transform .1s;
    }
    .ch-switch:hover { background: rgba(255,200,61,0.22); }
    .ch-switch:active { transform: scale(.985); }
    .ch-switch .sw-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
    .ch-switch .sw-t { flex: 1; min-width: 0; }
    .ch-switch .sw-t b { display: block; font-size: .95rem; }
    .ch-switch .sw-t span { display: block; font-size: .78rem; color: var(--text-2); }
    .ch-switch .sw-go { color: var(--accent); font-weight: 800; font-size: .85rem; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    /* Course header: level tabs, chapter carousel, parts path */
    .course {
      background: linear-gradient(170deg, var(--surface) 0%, var(--bg-2) 100%);
      border: 1px solid var(--line); border-radius: var(--r-xl); margin-bottom: 14px;
      box-shadow: var(--shadow); overflow: hidden; padding-top: 6px;
    }
    .lv-tabs { display: flex; align-items: flex-end; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .lv-tab { position: relative; padding: 10px 0 11px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; color: var(--text-3); text-align: left; }
    .lv-tab b { font-size: 1.15rem; font-weight: 850; letter-spacing: -0.01em; line-height: 1.1; }
    .lv-tab small { font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .lv-tab b em { font-style: normal; font-size: .7rem; font-weight: 750; margin-left: 6px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--text-3); vertical-align: 2px; }
    .lv-tab.on b em { background: var(--ok-soft); color: var(--ok); }
    .lv-tab.on { color: var(--text); }
    .lv-tab.on small { color: var(--text-2); }
    .lv-tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
    .lv-all { white-space: nowrap; flex: none; margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; background: var(--surface-2); color: var(--text); font-size: .8rem; font-weight: 750; }
    .lv-all:hover { background: var(--surface-3); }
    @media (max-width: 430px) {
      .lv-tabs { gap: 14px; padding: 0 14px; }
      .lv-all { width: 36px; padding: 0; justify-content: center; }
      .lv-all-t { display: none; }
      .lv-tab b em { margin-left: 4px; padding: 1px 5px; }
    }
    .strip-wrap { position: relative; }
    .strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 18px 16px; scroll-snap-type: x mandatory; scroll-padding: 0 18px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .strip::-webkit-scrollbar { display: none; }
    .cc {
      flex: 0 0 min(62%, 230px); scroll-snap-align: center; text-align: left; min-height: 108px;
      display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 18px;
      background: var(--surface-2); border: 1.5px solid transparent; transition: background .15s, border-color .15s, transform .15s;
    }
    .cc:hover { background: var(--surface-3); }
    .cc:active { transform: scale(.98); }
    .cc .n { display: flex; justify-content: space-between; align-items: center; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
    .cc .n svg { width: 1.2em; height: 1.2em; color: var(--ok); }
    .cc .t { flex: 1; font-weight: 800; font-size: .98rem; line-height: 1.25; color: var(--text); }
    .cc .bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
    .cc .bar i { display: block; height: 100%; background: var(--ok); }
    .cc.on { background: linear-gradient(160deg, var(--accent-soft), var(--surface-2) 80%); border-color: var(--accent); }
    .cc.on .n { color: var(--accent); }
    .cc.on .t { font-size: 1.05rem; }
    .strip-hint { position: absolute; right: 0; top: 14px; bottom: 16px; width: 28px; pointer-events: none; background: linear-gradient(90deg, transparent, var(--bg-2)); }
    .cur { padding: 2px 18px 18px; border-top: 1px solid var(--line); }
    .cur-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 0 12px; }
    .cur-head b { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
    .cur-head span { font-size: .75rem; color: var(--text-3); font-weight: 650; }
    .steps { display: flex; align-items: flex-start; }
    .step { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 50px; }
    .step .ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-3) 0); transition: transform .15s; }
    .step:active .ring { transform: scale(.94); }
    .step .ring > span { width: 37px; height: 37px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-weight: 850; font-size: 1rem; color: var(--text-2); }
    .step .ring svg { width: 18px; height: 18px; }
    .step small { font-size: .68rem; font-weight: 750; color: var(--text-3); white-space: nowrap; }
    .step.full .ring > span { background: var(--ok-soft); color: var(--ok); }
    .step.on .ring > span { background: var(--accent); color: var(--accent-ink); }
    .step.on small { color: var(--accent); }
    .steps .ln { flex: 1; height: 2px; min-width: 6px; margin-top: 22px; background: var(--surface-3); border-radius: 2px; }
    .steps .ln.full { background: var(--ok); }
    .steps .gap { flex: 1.4; min-width: 10px; margin-top: 22px; border-top: 2px dotted var(--surface-3); }
    .cur-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .cur-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--text-2); }
    .cur-stats b { color: var(--text); font-variant-numeric: tabular-nums; }
    .parts-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 16px; }
    .parts-head b { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .parts-head span { font-size: .75rem; color: var(--text-3); }
    .parts { display: grid; gap: 6px; margin-top: 8px; }
    .part {
      padding: 8px 4px 8px; border-radius: 12px; background: var(--surface-2); border: 1.5px solid transparent;
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
      transition: background .15s, border-color .15s;
    }
    .part:hover { background: var(--surface-3); }
    .part b { font-size: .85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .part b svg { width: .95em; height: .95em; color: var(--ok); }
    .part span { font-size: .68rem; color: var(--text-3); font-weight: 650; white-space: nowrap; }
    .part .pbar { width: 70%; height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 3px; }
    .part .pbar i { display: block; height: 100%; background: var(--ok); }
    .part.on { border-color: var(--accent); background: var(--accent-soft); }
    .part.on b { color: var(--accent); }
    .progress { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; display: flex; margin: 16px 0 10px; }
    .progress i { display: block; height: 100%; transition: width .4s var(--ease); }
    .progress .p-ok { background: var(--ok); }
    .progress .p-bad { background: var(--bad); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--text-2); align-items: center; }
    .legend b { color: var(--text); font-variant-numeric: tabular-nums; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
    .legend .spacer { flex: 1; }
    .done-btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700;
      padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--text-2);
    }
    .done-btn.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

    /* ---------- Mode tabs ---------- */
    .modes {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 14px; margin: 0 -16px;
      scrollbar-width: none; scroll-snap-type: x proximity;
    }
    .modes::-webkit-scrollbar { display: none; }
    .mode {
      flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      color: var(--text-2); font-weight: 700; font-size: .88rem; scroll-snap-align: start;
      transition: background .15s, color .15s, border-color .15s;
    }
    .mode:hover { color: var(--text); }
    .mode.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .mode .badge { background: var(--bad); color: #fff; font-size: .7rem; min-width: 18px; height: 18px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
    .mode.active .badge { background: var(--accent-ink); color: var(--accent); }

    /* ---------- Panel ---------- */
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl);
      padding: 20px; min-height: 420px; box-shadow: var(--shadow);
      animation: rise .25s var(--ease);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .muted { color: var(--text-2); }
    .small { font-size: .82rem; }
    .kbd-hint { font-size: .75rem; color: var(--text-3); text-align: center; margin-top: 14px; }
    .kbd-hint kbd { font-family: inherit; font-size: .7rem; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--text-2); }
    @media (hover: none) { .kbd-hint { display: none; } }

    .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
    .seg button { padding: 6px 12px; border-radius: 9px; font-size: .8rem; font-weight: 700; color: var(--text-2); }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    :root[data-theme="light"] .seg button.on { box-shadow: 0 1px 3px rgba(15,23,42,.12); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 18px; border-radius: var(--r-md); font-weight: 750; font-size: .95rem;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
      transition: transform .1s, background .15s, filter .15s; user-select: none;
    }
    .btn:hover { background: var(--surface-3); }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .btn-primary:hover { background: var(--accent); filter: brightness(1.07); }
    .btn-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
    .btn-ok:hover { background: var(--ok); color: #04150e; }
    .btn-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
    .btn-bad:hover { background: var(--bad); color: #1a0505; }
    .btn-ghost { background: transparent; }
    .btn-sm { height: 34px; padding: 0 12px; font-size: .82rem; border-radius: 10px; }
    .btn-lg { height: 56px; font-size: 1.02rem; border-radius: var(--r-lg); }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .gender-der { --g: var(--der); --g-soft: var(--der-soft); }
    .gender-die { --g: var(--die); --g-soft: var(--die-soft); }
    .gender-das { --g: var(--das); --g-soft: var(--das-soft); }
    .art { color: var(--g, var(--text-2)); font-weight: 800; }

    /* ---------- Flashcards ---------- */
    .deck-bar { height: 4px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
    .deck-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s var(--ease); }
    .card-stage { position: relative; perspective: 1400px; margin-bottom: 16px; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
    .fcard { touch-action: pan-y; -webkit-user-select: none; -webkit-touch-callout: none; }
    .fcard {
      position: relative; min-height: 300px; -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
      transition: transform .55s var(--ease); cursor: pointer; user-select: none;
    }
    .fcard.flipped { transform: rotateY(180deg); }
    .fcard.dragging { transition: none; }
    .fface {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column;
      background: var(--surface-2); border: 1px solid var(--line-strong);
    }
    .fface.back { transform: rotateY(180deg); }
    /* iPhone Safari keeps the hidden side of a flip card on top for taps: only the visible side may receive them */
    .fcard:not(.flipped) .fface.back, .fcard.flipped .fface:not(.back) { pointer-events: none; }
    .fface:not(.back) { transform: translateZ(1px); }
    .fface.back { transform: rotateY(180deg) translateZ(1px); }
    .fface.g { background: linear-gradient(160deg, var(--g-soft), var(--surface-2) 70%); border-color: var(--g); border-color: color-mix(in srgb, var(--g) 45%, transparent); }
    .fface-top { display: flex; justify-content: space-between; align-items: center; font-size: .75rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .fface-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 10px 0; }
    .fword { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 850; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
    .fsub { color: var(--text-2); font-size: .95rem; }
    .fsub b { color: var(--text); font-weight: 700; }
    .fhint { text-align: center; font-size: .78rem; color: var(--text-3); }
    .gtag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--g-soft); color: var(--g); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .speak { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2); background: var(--surface-3); }
    .speak:hover { color: var(--text); }
    /* Swipe feedback: the card fills with green/red and a badge grows in, the farther you drag */
    .fface::after {
      content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; pointer-events: none;
      background: var(--sw-bg, none);
      opacity: calc(var(--sw-a, 0) * .7); transition: opacity .3s ease;
    }
    .fcard.dragging .fface::after { transition: none; }
    .swipe-tag {
      position: absolute; top: 16px; z-index: 5; pointer-events: none; opacity: 0;
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
      font-weight: 900; font-size: .85rem; letter-spacing: .05em; box-shadow: 0 8px 24px rgba(0,0,0,.35);
      transform: translateX(var(--tag-x, 0px)) scale(var(--tag-s, .75)) rotate(var(--tag-r, 0deg));
      transition: opacity .22s ease, transform .28s cubic-bezier(.2,.9,.3,1.15);
    }
    .swipe-tag svg { width: 1.1em; height: 1.1em; stroke-width: 3; }
    .swipe-tag.l { left: 14px; background: var(--bad); color: #fff; --tag-r: -6deg; transform-origin: left center; }
    .swipe-tag.r { right: 14px; background: var(--ok); color: #04150e; --tag-r: 6deg; transform-origin: right center; }
    .card-stage.dragging .swipe-tag { transition: opacity .12s linear, transform .16s ease-out; }
    .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rate .btn { white-space: nowrap; padding: 0 10px; }
    @media (max-width: 420px) { .rate .btn { font-size: .92rem; gap: 6px; padding: 0 8px; } .rate .btn svg { width: 1em; height: 1em; } }
    .deck-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .deck-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .deck-mid .btn { height: 28px; padding: 0 10px; font-size: .78rem; color: var(--text-2); }
    .summary { text-align: center; padding: 30px 10px; }
    .summary .big { font-size: 3.2rem; line-height: 1; margin-bottom: 10px; }
    .summary h2 { font-size: 1.5rem; letter-spacing: -0.01em; margin-bottom: 6px; }
    .summary p { color: var(--text-2); margin-bottom: 22px; }
    .stat-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .stat { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 18px; min-width: 96px; }
    .stat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat span { font-size: .75rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }

    /* ---------- Quiz / options ---------- */
    .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; color: var(--text-2); font-weight: 700; margin-bottom: 10px; }
    .q-prompt { text-align: center; padding: 26px 8px 24px; }
    .q-label { font-size: .75rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
    .q-word { font-size: clamp(1.4rem, 5.5vw, 2rem); font-weight: 850; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 10px; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
    .opt {
      text-align: left; padding: 14px 16px; min-height: 56px; border-radius: var(--r-md);
      background: var(--surface-2); border: 1.5px solid transparent; font-weight: 650; display: flex; gap: 12px; align-items: center;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .opt:hover:not(:disabled) { background: var(--surface-3); }
    .opt:active:not(:disabled) { transform: scale(.98); }
    .opt .n { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); color: var(--text-3); font-size: .75rem; font-weight: 800; display: grid; place-items: center; flex: none; }
    .opt.correct { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
    .opt.correct .n { background: var(--ok); color: #04150e; }
    .opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); animation: shake .35s; }
    .opt.wrong .n { background: var(--bad); color: #fff; }
    .opt:disabled { cursor: default; }
    @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

    .feedback { margin-top: 14px; padding: 12px 14px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; animation: rise .2s var(--ease); }
    .feedback.ok { background: var(--ok-soft); color: var(--ok); }
    .feedback.bad { background: var(--bad-soft); color: var(--bad); }
    .feedback.meh { background: var(--accent-soft); color: var(--accent); }
    .feedback .fb-text { display: flex; flex-direction: column; gap: 2px; }
    .feedback .fb-text small { color: var(--text-2); font-weight: 600; }

    /* ---------- Type mode ---------- */
    .type-box { display: flex; gap: 8px; }
    .type-input {
      flex: 1; min-width: 0; height: 56px; padding: 0 16px; border-radius: var(--r-md);
      background: var(--surface-2); border: 1.5px solid var(--line-strong); font-size: 1.1rem; font-weight: 650; outline: none;
    }
    .type-input:focus { border-color: var(--accent); }
    .type-input.ok { border-color: var(--ok); color: var(--ok); }
    .type-input.bad { border-color: var(--bad); color: var(--bad); }
    .umlauts { display: flex; gap: 6px; margin-top: 10px; justify-content: center; }
    .umlauts button { width: 44px; height: 40px; border-radius: 10px; background: var(--surface-2); font-weight: 750; font-size: 1.05rem; }
    .umlauts button:hover { background: var(--surface-3); }

    /* ---------- Articles ---------- */
    .art-word { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 850; letter-spacing: -0.02em; margin: 6px 0 4px; overflow-wrap: anywhere; }
    .art-slot { display: inline-block; min-width: 2.6em; border-bottom: 3px dashed var(--line-strong); color: var(--text-3); margin-right: .25em; }
    .art-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .art-btn {
      height: 72px; border-radius: var(--r-lg); font-size: 1.35rem; font-weight: 850;
      background: var(--g-soft); color: var(--g); border: 1.5px solid transparent; transition: transform .1s, border-color .15s, background .15s;
    }
    .art-btn:hover:not(:disabled) { border-color: var(--g); }
    .art-btn:active:not(:disabled) { transform: scale(.96); }
    .art-btn.correct { background: var(--g); color: var(--bg); }
    .art-btn.wrong { border-color: var(--bad); animation: shake .35s; opacity: .7; }
    .art-btn:disabled { cursor: default; }
    .art-btn small { display: block; font-size: .65rem; font-weight: 700; opacity: .7; letter-spacing: .06em; text-transform: uppercase; }

    /* ---------- Match ---------- */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-col { display: flex; flex-direction: column; gap: 10px; }
    .tile {
      min-height: 64px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2);
      border: 1.5px solid transparent; font-weight: 700; font-size: .92rem; line-height: 1.25; text-align: center;
      display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere;
      transition: background .15s, border-color .15s, opacity .3s, transform .15s;
    }
    .tile:hover { background: var(--surface-3); }
    .tile.sel { border-color: var(--accent); background: var(--accent-soft); }
    .tile.miss { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
    .tile.hit { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); opacity: .35; pointer-events: none; transform: scale(.97); }

    /* ---------- Sprint ---------- */
    .timer-bar { height: 8px; border-radius: 8px; background: var(--surface-3); overflow: hidden; margin-bottom: 10px; }
    .timer-bar i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
    .timer-bar.low i { background: var(--bad); }
    .combo { color: var(--accent); font-weight: 850; }
    .hero { text-align: center; padding: 30px 10px; }
    .hero .hero-icon { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 22px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .hero .hero-icon svg { width: 34px; height: 34px; }
    .hero h2 { font-size: 1.6rem; letter-spacing: -0.02em; margin-bottom: 6px; }
    .hero p { color: var(--text-2); max-width: 380px; margin: 0 auto 22px; }

    /* ---------- Sentences ---------- */
    .build { min-height: 70px; border-radius: var(--r-lg); border: 2px dashed var(--line-strong); padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 16px; transition: border-color .15s; }
    .build.filled { border-style: solid; }
    .build.ok { border-color: var(--ok); }
    .build.bad { border-color: var(--bad); }
    .pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 48px; margin-bottom: 18px; }
    .wchip { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-strong); font-weight: 700; transition: transform .1s, background .15s; }
    .wchip:hover { background: var(--surface-3); }
    .wchip:active { transform: scale(.95); }
    .wchip.placed { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

    /* ---------- Word list ---------- */
    .search { position: relative; flex: 1; min-width: 200px; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
    .search input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); padding: 0 12px 0 38px; font-size: 16px; outline: none; }
    .search input:focus { border-color: var(--accent); }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 14px; align-items: center; }
    .fchip { height: 32px; padding: 0 12px; border-radius: 99px; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--text-2); }
    .fchip.on { background: var(--text); color: var(--bg); }
    .fchip.scope { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
    .wlist { display: flex; flex-direction: column; }
    .wrow { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }
    .wrow:last-child { border-bottom: 0; }
    .wrow .bar { align-self: stretch; border-radius: 4px; background: var(--g, var(--surface-3)); }
    .wrow .de { font-weight: 750; overflow-wrap: anywhere; }
    .wrow .en { color: var(--text-2); font-size: .9rem; overflow-wrap: anywhere; }
    .wrow .extra { color: var(--text-3); font-size: .78rem; margin-top: 1px; }
    .wrow .acts { display: flex; gap: 6px; align-items: center; }
    .pill { height: 28px; padding: 0 10px; border-radius: 99px; font-size: .72rem; font-weight: 800; letter-spacing: .02em; white-space: nowrap; background: var(--surface-2); color: var(--text-3); }
    .pill.learned { background: var(--ok-soft); color: var(--ok); }
    .pill.hard { background: var(--bad-soft); color: var(--bad); }
    .empty { text-align: center; color: var(--text-2); padding: 50px 10px; }

    /* ---------- Sheets ---------- */
    .scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet {
      background: var(--bg-2); width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column;
      border-radius: var(--r-xl) var(--r-xl) 0 0; border: 1px solid var(--line); border-bottom: 0;
      padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); animation: up .3s var(--ease);
    }
    @media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: var(--r-xl); border-bottom: 1px solid var(--line); } }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet-grab { width: 40px; height: 5px; background: var(--line-strong); border-radius: 5px; margin: 0 auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .sheet-head h3 { font-size: 1.15rem; }
    .sheet-body { overflow-y: auto; margin: 0 -16px; padding: 0 16px; }
    .ch-list { display: grid; grid-template-columns: 1fr; gap: 6px; }
    @media (min-width: 560px) { .ch-list { grid-template-columns: 1fr 1fr; } }
    .ch-item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid transparent; }
    .ch-item:hover { background: var(--surface-2); }
    .ch-item.cur { border-color: var(--accent); }
    .ch-num { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--text-2); }
    .ch-item.done .ch-num { background: var(--ok); color: #04150e; }
    .ch-item .t { font-weight: 700; font-size: .9rem; line-height: 1.25; }
    .ch-item .mini { height: 4px; background: var(--surface-3); border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .ch-item .mini i { display: block; height: 100%; background: var(--ok); }
    .ch-item .pct { font-size: .75rem; color: var(--text-3); font-weight: 700; font-variant-numeric: tabular-nums; }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .set-row:last-child { border-bottom: 0; }
    .set-row .lbl b { display: block; font-size: .95rem; }
    .set-row .lbl span { font-size: .8rem; color: var(--text-2); }
    .toggle { width: 50px; height: 30px; border-radius: 30px; background: var(--surface-3); position: relative; transition: background .2s; flex: none; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .toggle.on { background: var(--ok); }
    .toggle.on::after { transform: translateX(20px); }

    .icon-btn { position: relative; }
    .icon-btn .nd { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
    .inst-intro { color: var(--text-2); font-size: .9rem; margin: -4px 0 14px; }
    .inst-tabs { display: flex; margin-bottom: 14px; }
    .inst-tabs .seg { flex: 1; display: flex; }
    .inst-tabs .seg button { flex: 1; padding: 9px 10px; font-size: .88rem; }
    .inst-sub { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 16px 0 8px; }
    .inst-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .inst-list li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: var(--r-md); background: var(--surface); font-size: .92rem; line-height: 1.45; }
    .inst-list .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 850; font-size: .85rem; }
    .inst-list b { font-weight: 800; }
    .glyph { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--surface-3); color: var(--text); vertical-align: -7px; margin: 0 2px; }
    .glyph svg { width: 16px; height: 16px; }
    .inst-note { margin-top: 12px; font-size: .82rem; color: var(--text-2); padding: 10px 12px; border-radius: var(--r-md); background: var(--accent-soft); }
    .inst-done { text-align: center; padding: 20px 10px 6px; }
    .inst-done .big { font-size: 2.6rem; }
    .update-bar {
      position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); z-index: 70;
      max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
      padding: 10px 10px 10px 16px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
      font-weight: 750; font-size: .9rem; box-shadow: var(--shadow); animation: up .3s var(--ease);
    }
    .update-bar span { flex: 1; }
    .update-bar button { height: 36px; padding: 0 16px; border-radius: 11px; background: var(--accent-ink); color: var(--accent); font-weight: 800; }
    /* Part bar: shown above every mode so it's obvious a chapter has several parts */
    .partbar {
      display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 10px 12px;
      border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line);
    }
    .pb-label { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; overflow: hidden; }
    .pb-label b { font-size: .95rem; font-weight: 850; white-space: nowrap; }
    .pb-label b em { font-style: normal; color: var(--accent); }
    .pb-label span { font-size: .72rem; color: var(--text-3); font-weight: 650; white-space: nowrap; }
    .pb-pills { display: flex; gap: 4px; margin-left: auto; }
    .pb-pill { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); color: var(--text-2); font-weight: 850; font-size: .82rem; display: grid; place-items: center; position: relative; }
    .pb-pill.full { color: var(--ok); }
    .pb-pill.on { background: var(--accent); color: var(--accent-ink); }
    .pb-pill.all { width: auto; padding: 0 8px; }
    .pb-next { height: 30px; padding: 0 10px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: .8rem; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    @media (max-width: 420px) { .pb-next .t { display: none; } .pb-next { padding: 0 6px; } .pb-pill { width: 28px; } }
    .parts-hint { margin-top: 12px; padding: 8px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: .8rem; font-weight: 650; line-height: 1.4; }
    .parts-hint b { color: var(--accent); }
    .cc .np { font-size: .72rem; font-weight: 700; color: var(--text-3); }
    .cc.on .np { color: var(--text-2); }
    .next-part { margin: 0 auto 18px; max-width: 420px; padding: 14px; border-radius: var(--r-md); background: var(--accent-soft); border: 1.5px dashed var(--accent); }
    .next-part b { display: block; font-size: 1rem; margin-bottom: 2px; }
    .next-part span { font-size: .85rem; color: var(--text-2); }
    /* Translation notice */
    .foot { text-align: center; margin-top: 18px; }
    .foot button { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--text); }
    .foot button b { font-size: .9rem; font-weight: 800; }
    .made-by { margin-top: 14px; font-size: .62rem; color: var(--text-3); opacity: .35; letter-spacing: .03em; }
    .foot button span { font-size: .75rem; color: var(--text-3); font-weight: 650; }
    .foot button:hover { background: var(--surface-2); }
    .notice { text-align: center; padding: 6px 4px 4px; }
    .notice .n-ic { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .notice .n-ic svg { width: 30px; height: 30px; }
    .notice h3 { font-size: 1.25rem; margin-bottom: 8px; }
    .notice p { color: var(--text-2); font-size: .95rem; line-height: 1.5; margin: 0 auto 16px; max-width: 400px; }
    .notice-tip { font-size: .8rem !important; color: var(--text-3) !important; margin: 4px auto 12px !important; }
    .notice-tip b { color: var(--text-2); }

    /* ================= Data parsing ================= */
    function parseVocabLine(line, verbatim) {
      const cut = line.indexOf('—');
      if (cut < 0) return null;
      const de = line.slice(0, cut).trim();
      let en = line.slice(cut + 1).trim();
      if (verbatim) {
        const m = de.match(/^(der|die|das)\s+([A-ZÄÖÜ].*)$/);
        return { de, en, article: m ? m[1] : '', noun: m ? m[2] : '', plural: '', forms: '', note: '' };
      }
      let plural = '', forms = '';
      // Grammar info is the trailing "  (...)" group (separated by two spaces)
      const g = en.match(/\s{2,}\(([^()]*)\)\s*$/);
      if (g) {
        en = en.slice(0, g.index).trim();
        const info = g[1].trim();
        if (/^pl\.?\s/.test(info)) plural = info.replace(/^pl\.?\s*/, '');
        else forms = info;
      }
      let note = '';
      const n = en.match(/\s\((informal|formal|colloquial|abbr\.|masc\.|fem\.|neut\.|male|female)\)$/);
      if (n) { note = n[1]; en = en.slice(0, n.index).trim(); }
      const m = de.match(/^(der|die|das)\s+([A-ZÄÖÜ].*)$/);
      const article = m ? m[1] : '';
      const noun = m ? m[2] : '';
      return { de, en, article, noun, plural, forms, note };
    }

    function buildData(raw, verbatim) {
      const chapters = {};

      for (const rawLine of raw.split('\n')) {

        const head = line.match(/^=====.*Chapter\s+(\d+)/);
        if (head) { ch = +head[1]; chapters[ch] = []; continue; }
        if (ch && line.includes('—')) { const w = parseVocabLine(line, typeof verbatim === 'function' ? verbatim(ch) : verbatim); if (w) chapters[ch].push(w); }
      }
      return chapters;

    /* ================= Speech ================= */

    const Speech = {
      ok: 'speechSynthesis' in window,
      voices: [],      // German voices on this device
      voice: null,     // the one we use
      ready: false,    // voice list has been checked
      init() {
        if (!this.ok) { this.ready = true; return; }
        const load = () => this.load();
        if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load);
        else speechSynthesis.onvoiceschanged = load;

      saveCards() {
        const s = this.s;
        if (!s.deck) return;
        let cs = Store.d.cardSession;
        if (!cs || cs.ch !== this.chKey()) cs = Store.d.cardSession = { ch: this.chKey(), parts: {} };
        cs.parts[this.part] = {
          filter: s.filter, shuffled: s.shuffled, i: s.i, got: s.got, again: s.again,
          deck: s.deck.map(w => w.de), againList: s.againList.map(w => w.de), skipped: s.skipped || [], answers: s.answers || {}, hist: s.hist || [],
        };
        Store.save();
      },
      restoreCards() {
        const cs = Store.d.cardSession;
        const d = cs && cs.ch === this.chKey() && cs.parts[this.part];
        if (!d) return null;
        const byKey = new Map(this.pool().map(w => [w.de, w]));
        const pool = this.pool();
        const saved = {
          flipped: false, got: d.got || 0, again: d.again || 0,
          againList: (d.againList || []).map(k => byKey.get(k)).filter(Boolean),
          skipped: (d.skipped || []).filter(k => byKey.has(k)), answers: d.answers || {},
        };
        // The part's words changed (word-list update): keep your place at the same word.
        if ((d.filter || 'all') === 'all' && !d.shuffled && (d.deck.length !== pool.length || d.deck.some(k => !byKey.has(k)))) {
          const at = pool.findIndex(w => w.de === d.deck[d.i]);
          return { ...saved, filter: 'all', shuffled: false, deck: pool, i: at >= 0 ? at : Math.min(d.i || 0, pool.length), hist: [] };
        }
        const deck = d.deck.map(k => byKey.get(k)).filter(Boolean);
        if (!deck.length) return null;
        return { ...saved, filter: d.filter || 'all', shuffled: !!d.shuffled, deck, i: Math.min(d.i || 0, deck.length), hist: d.hist || [] };
      },
      pool() { const p = this.part; return p ? (this.partLists()[p - 1] || this.words()) : this.words(); },
      poolName() { return this.part ? 'Part ' + this.part : 'this chapter'; },
      countList(list) {
        let learned = 0, hard = 0;
        for (const w of list) { const s = Store.status(w.de); if (s === 'learned') learned++; else if (s === 'hard') hard++; }
        return { total: list.length, learned, hard, fresh: list.length - learned - hard };
      },

      counts(level = this.level, ch = this.chapter) {
        const list = this.words(level, ch);
        let learned = 0, hard = 0;
        for (const w of list) { const s = Store.status(w.de); if (s === 'learned') learned++; else if (s === 'hard') hard++; }
        return { total: list.length, learned, hard, fresh: list.length - learned - hard };
      },

      levelPct(level) {
        let total = 0, learned = 0;
        for (let ch = 1; ch <= 24; ch++) { const c = this.counts(level, ch); total += c.total; learned += c.learned; }
        return total ? Math.round(learned / total * 100) : 0;
      },

      renderChapterCard() {
        this.renderMyEntry();
        if (this.level === 'MY') return this.renderMyCard();
        const done = !!Store.d.completedChapters[this.chKey()];
        const tab = (lv, name) => `<button class="lv-tab ${this.level === lv ? 'on' : ''}" data-action="set-level" data-level="${lv}"><b>${lv}<em>${this.levelPct(lv)}%</em></b><small>${name}</small></button>`;
        const cards = Array.from({ length: 24 }, (_, i) => i + 1).map(ch => {
          const c = this.counts(this.level, ch), pct = c.total ? c.learned / c.total * 100 : 0;
          const isDone = Store.d.completedChapters[`${this.level}_${ch}`];
          return `<button class="cc ${ch === this.chapter ? 'on' : ''}" data-action="pick-ch" data-level="${this.level}" data-ch="${ch}">
              <span class="n">Chapter ${ch}${isDone ? icon('check') : `<span>${Math.round(pct)}%</span>`}</span>
              <span class="t">${esc(this.title(this.level, ch))}</span>
              <span class="np">${this.partLists(this.level, ch).length} parts · ${c.total} words</span>
              <span class="bar"><i style="width:${pct}%"></i></span>
            </button>`;
        }).join('');

        const lists = this.partLists(), cur = this.part;
        let steps = '';
        lists.forEach((l, i) => {
          const c = this.countList(l), p = c.total ? Math.round(c.learned / c.total * 100) : 0, full = c.total && c.learned === c.total;
          if (i) steps += `<span class="ln ${full ? 'full' : ''}"></span>`;
          steps += `<button class="step ${cur === i + 1 ? 'on' : ''} ${full ? 'full' : ''}" style="--p:${p}" data-action="set-part" data-p="${i + 1}" aria-label="Part ${i + 1}, ${l.length} words, ${p}% mastered">
              <span class="ring"><span>${full && cur !== i + 1 ? icon('check') : i + 1}</span></span><small>Part ${i + 1}</small></button>`;
        });
        const all = this.countList(this.words()), allP = all.total ? Math.round(all.learned / all.total * 100) : 0;
        steps += `<span class="gap"></span><button class="step ${cur === 0 ? 'on' : ''}" style="--p:${allP}" data-action="set-part" data-p="0" aria-label="Whole chapter">
            <span class="ring"><span>${icon('list')}</span></span><small>All</small></button>`;

        const pc = this.countList(this.pool());
        $('#chapter-card').innerHTML = `
          <div class="lv-tabs">
            ${LEVELS.map(l => tab(l.id, l.name)).join('')}
            <button class="lv-all" data-action="chapters" aria-label="All chapters">${icon('grid')}<span class="lv-all-t">Chapters</span></button>
          </div>
          <div class="strip-wrap"><div class="strip" id="ch-strip">${cards}</div><span class="strip-hint"></span></div>
          <div class="cur">
            <div class="cur-head"><b>${cur ? `Part ${cur} of ${lists.length}` : 'Whole chapter'}</b><span>${cur ? 'words ' + this.chapterRange() : all.total + ' words'}</span></div>
            <div class="steps">${steps}</div>
            ${Store.d.seenParts ? '' : `<div class="parts-hint">👆 This chapter has <b>${lists.length} parts</b> — tap a number to switch part</div>`}
            <div class="cur-info">
              <div class="cur-stats">
                <span><i class="dot" style="background:var(--ok)"></i><b>${pc.learned}</b> mastered</span>
                <span><i class="dot" style="background:var(--bad)"></i><b>${pc.hard}</b> still learning</span>
                <span><i class="dot" style="background:var(--surface-3)"></i><b>${pc.fresh}</b> new</span>
              </div>
              <button class="done-btn ${done ? 'on' : ''}" data-action="toggle-done">${done ? icon('check') + ' Chapter done' : 'Mark chapter done'}</button>
            </div>
          </div>`;
        const strip = $('#ch-strip'), act = strip.querySelector('.cc.on');
        if (act) strip.scrollLeft = act.offsetLeft - (strip.clientWidth - act.offsetWidth) / 2;
      },

      partsHtml() {
        const lists = this.partLists(), cur = this.part;
        const chips = lists.map((l, i) => {
          const c = this.countList(l), full = c.total && c.learned === c.total;
          return `<button class="part ${cur === i + 1 ? 'on' : ''}" data-action="set-part" data-p="${i + 1}">
              <b>Part ${i + 1}${full ? icon('check') : ''}</b><span>${l.length} words</span>
              <span class="pbar"><i style="width:${c.total ? c.learned / c.total * 100 : 0}%"></i></span>
            </button>`;
        }).join('');
        const all = this.countList(this.words());
        return `
          <div class="parts-head"><b>Study in parts</b><span>${cur ? 'words ' + this.chapterRange() : 'whole chapter'}</span></div>
          <div class="parts" style="grid-template-columns:repeat(${lists.length + 1}, minmax(0, 1fr))">
            ${chips}
            <button class="part ${cur === 0 ? 'on' : ''}" data-action="set-part" data-p="0">
              <b>All${all.total && all.learned === all.total ? icon('check') : ''}</b><span>${all.total} words</span>
              <span class="pbar"><i style="width:${all.total ? all.learned / all.total * 100 : 0}%"></i></span>
            </button>
          </div>`;
      },
      chapterRange() {
        const lists = this.partLists(); let a = 1;
        for (let i = 0; i < this.part - 1; i++) a += lists[i].length;
        return a + '–' + (a + lists[this.part - 1].length - 1);
      },

      renderModes() {
        const hard = this.countList(this.pool()).hard;
        $('#modes').innerHTML = MODES.map(m => `
          <button class="mode ${this.mode === m.id ? 'active' : ''}" data-action="mode" data-mode="${m.id}">
            ${icon(m.icon)}${m.label}${m.id === 'cards' && hard ? `<span class="badge">${hard}</span>` : ''}
          </button>`).join('');
        const act = $('#modes .mode.active');
        if (act) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      },

      renderPanel() {
        this.clearTimers();
        const p = $('#panel');
        p.style.animation = 'none'; p.offsetHeight; p.style.animation = '';
        if (this.level === 'MY' && !this.words().length) {
          return p.innerHTML = `<div class="hero"><div class="hero-icon">${icon('star')}</div><h2>No saved words yet</h2>

        }
        const fn = { cards: 'renderCards', quiz: 'renderQuiz', type: 'renderType', articles: 'renderArticles', match: 'renderMatch', sprint: 'renderSprint', sentences: 'renderSentences', words: 'renderWords' }[this.mode];
        this[fn](p);
      },

      refreshStats() { this.renderStreak(); this.renderChapterCard(); this.renderModes(); this.renderPartBar(); },

      setChapter(level, ch, stay) {
        if (level !== this.level || ch !== this.chapter) this.forgetSessions();
        else this.stashSession();
        this.level = level; this.chapter = ch; this.loadSession();
        this.persist(); this.render();
        if (!stay) window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      setMode(m) { this.stashSession(); this.mode = m; this.loadSession(); this.persist(); this.renderModes(); this.renderPanel(); },

      toast(msg) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3500);
      },

      /* ---------- Events ---------- */
      onClick(e) {
        const el = e.target.closest('[data-action]');
        const td = this.tapDone;
        if (e.type === 'click' && td && Date.now() - td.t < 800 && Math.abs(e.clientX - td.x) < 6 && Math.abs(e.clientY - td.y) < 6) { this.tapDone = null; return; }  // same touch, already handled on finger lift
        if (!el || el.disabled) return;
        const a = el.dataset.action, ds = el.dataset;
        switch (a) {
          case 'mode': return this.setMode(ds.mode);
          case 'chapters': return this.openChapters(this.level === 'MY' ? (Store.d.lastNormalLevel || 'A1') : this.level);
          case 'star': e.stopPropagation(); return this.toggleStar(ds.key, ds.l, ds.ch);
          case 'open-my': return this.setChapter('MY', 1);
          case 'leave-my': { const L = Store.d.lastNormalLevel || 'A1'; return this.setChapter(L, (Store.d.levelChapter || {})[L] || 1); }
          case 'sheet-level': return this.openChapters(ds.level);
          case 'set-level': if (ds.level === this.level) return; this.toast(ds.level + ' selected'); return this.setChapter(ds.level, (Store.d.levelChapter || {})[ds.level] || 1);
          case 'pick-ch': { const fromSheet = !!$('#overlay').firstChild; this.closeSheet(); if (!fromSheet && +ds.ch === this.chapter && ds.level === this.level) return; return this.setChapter(ds.level, +ds.ch, !fromSheet); }
          case 'ch-step': return this.setChapter(this.level, Math.min(24, Math.max(1, this.chapter + +ds.dir)));
          case 'close-sheet': if (el.classList.contains('scrim') && e.target !== el) return; if (this.sheetLocked) return; return this.closeSheet();
          case 'set-part': return this.setPart(+ds.p);
          case 'toggle-done': {
            const k = this.chKey();
            Store.d.completedChapters[k] = !Store.d.completedChapters[k]; Store.save();
            if (Store.d.completedChapters[k]) this.toast('Nice! Chapter marked as done');
            return this.renderChapterCard();
          }
          case 'theme': {
            Store.d.settings.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            Store.save(); this.applyTheme();
            if ($('#overlay').firstChild) this.openSettings();
            return;
          }
          case 'settings': return this.openSettings();
          case 'set-toggle': {
            Store.d.settings[ds.key] = !Store.d.settings[ds.key]; Store.save();
            el.classList.toggle('on', Store.d.settings[ds.key]); return;
          }
          case 'check-update': return this.checkUpdate(el);
          case 'install': return this.openInstall();
          case 'install-os': return this.openInstall(ds.os);
          case 'install-now': {
            if (!this.installPrompt) return;
            this.installPrompt.prompt();
            this.installPrompt.userChoice.finally(() => { this.installPrompt = null; this.closeSheet(); });
            return;
          }
          case 'do-update': return location.reload();
          case 'notice': return this.openNotice(false);
          case 'export': return this.exportProgress();
          case 'import': return $('#import-file').click();
          case 'reset-all': {
            if (!confirm('Reset ALL progress (mastered words, practice list, streak)? This cannot be undone.')) return;
            Object.assign(Store.d, { completedChapters: {}, learnedWords: {}, difficultWords: {}, streak: { day: null, count: 0 }, best: {} });
            Store.save(); this.closeSheet(); this.forgetSessions(); this.s = {}; this.render(); return this.toast('Progress reset');
          }
          case 'speak': {
            e.stopPropagation();
            if (Speech.ok && !Speech.ready) Speech.load();
            if (Speech.say(ds.text)) return;
            return this.openVoiceHelp();
          }
          case 'voice-os': return this.openVoiceHelp(ds.os);
          case 'voice-help': return this.openVoiceHelp();
          case 'voice-test': return Speech.say('Hallo! Das ist meine deutsche Stimme.') || this.openVoiceHelp();
        }
        const h = this[`on_${this.mode}`];
        if (h) h.call(this, a, el, e);
      },

      onKey(e) {
        if ($('#overlay').firstChild) { if (e.key === 'Escape' && !this.sheetLocked) this.closeSheet(); return; }
        const typing = !!(e.target.matches && e.target.matches('input, textarea'));
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const h = this[`key_${this.mode}`];
        if (h) h.call(this, e, typing);
      },

      /* ---------- Sheets ---------- */
      openSheet(html) {

            <p class="notice-tip" style="margin-top:0 !important;font-size:.62rem !important;opacity:.35">Made by Ahmed Hashash</p>
            ${first
              ? `<button class="hold-btn" id="hold-btn" aria-label="Press and hold to close"><i></i><span>Hold to close</span></button>`
              : `<button class="btn btn-lg" style="width:100%" data-action="close-sheet">Got it</button>`}
          </div></div>`);

      openChapters(level) {
