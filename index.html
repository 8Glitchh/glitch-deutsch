    /* ================= Helpers ================= */
    const $ = (s, r = document) => r.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const pick = (arr, n) => shuffle(arr).slice(0, n);
    const dayKey = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const gClass = w => w.article ? `gender-${w.article}` : '';

    /* ================= Storage (compatible with v3 progress) ================= */
    const Store = {
      KEY: 'glitch_deutsch_data_v3',
      d: null,
      load() {
        let d = {};
        try { d = JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { d = {}; }
        this.d = Object.assign({
          completedChapters: {}, learnedWords: {}, difficultWords: {},
          lastLevel: 'A1', lastChapter: 1,
          lastMode: 'cards', streak: { day: null, count: 0 }, best: {},
          settings: { theme: null, autoSpeak: false, dir: 'de-en' },
        }, d);
        this.d.settings = Object.assign({ theme: null, autoSpeak: false, dir: 'de-en' }, this.d.settings);
        return this.d;
      },
      save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); } catch (e) {} },
      status(key) { return this.d.learnedWords[key] ? 'learned' : this.d.difficultWords[key] ? 'hard' : 'new'; },
      setStatus(key, s) {
        delete this.d.learnedWords[key]; delete this.d.difficultWords[key];
        if (s === 'learned') this.d.learnedWords[key] = true;
        if (s === 'hard') this.d.difficultWords[key] = true;
        this.touchStreak(); this.save();
      },
      touchStreak() {
        const today = dayKey(), y = new Date(); y.setDate(y.getDate() - 1);
        const s = this.d.streak;
        if (s.day === today) return;
        s.count = s.day === dayKey(y) ? s.count + 1 : 1;
        s.day = today;
      },
      liveStreak() {
        const s = this.d.streak, y = new Date(); y.setDate(y.getDate() - 1);
        return (s.day === dayKey() || s.day === dayKey(y)) ? s.count : 0;
      },
    };

    /* ================= Data parsing ================= */
    function parseVocabLine(line) {
      const cut = line.indexOf('—');
      if (cut < 0) return null;
      const de = line.slice(0, cut).trim();
      let en = line.slice(cut + 1).trim();
      let plural = '', forms = '';
      // Grammar info is the trailing "  (...)" group (separated by two spaces)
      const g = en.match(/\s{2,}\(([^()]*)\)\s*$/);
      if (g) {
        en = en.slice(0, g.index).trim();
        const info = g[1].trim();
        if (/^pl\.?\s/.test(info)) plural = info.replace(/^pl\.?\s*/, '');
        else forms = info;
      }
      let note = '';
      const n = en.match(/\s\((informal|formal|colloquial|abbr\.|masc\.|fem\.|neut\.|male|female)\)$/);
      if (n) { note = n[1]; en = en.slice(0, n.index).trim(); }
      const m = de.match(/^(der|die|das)\s+([A-ZÄÖÜ].*)$/);
      const article = m ? m[1] : '';
      const noun = m ? m[2] : '';
      return { de, en, article, noun, plural, forms, note };
    }

    function buildData(raw) {
      const chapters = {};
      let ch = 0;
      for (const rawLine of raw.split('\n')) {
        const line = rawLine.trim();
        if (!line) continue;
        const head = line.match(/^=====.*Chapter\s+(\d+)/);
        if (head) { ch = +head[1]; chapters[ch] = []; continue; }
        if (ch && line.includes('—')) { const w = parseVocabLine(line); if (w) chapters[ch].push(w); }
      }
      return chapters;
    }

    /* ================= Speech ================= */
    const Speech = {
      voice: null,
      ok: 'speechSynthesis' in window,
      init() {
        if (!this.ok) return;
        const pickVoice = () => {
          const vs = speechSynthesis.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
          this.voice = vs.find(v => /de-DE/i.test(v.lang) && v.localService) || vs.find(v => /de-DE/i.test(v.lang)) || vs[0] || null;
        };
        pickVoice();
        speechSynthesis.onvoiceschanged = pickVoice;
      },
      say(text) {
        if (!this.ok || !text) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ', '));
        u.lang = 'de-DE'; u.rate = 0.92;
        if (this.voice) u.voice = this.voice;
        speechSynthesis.speak(u);
      },
    };

    /* ================= App ================= */
    const app = {
      data: { A1: {}, A2: {}, B1: {} },
      level: 'A1', chapter: 1, mode: 'cards',
      s: {},          // per-mode session state
      sessions: {},   // saved sessions for other parts/modes of the current chapter
      timers: [],

      init() {
        this.data.A1 = buildData(rawA1Text);
        const nojs = document.getElementById('nojs'); if (nojs) nojs.remove();
        this.data.A2 = buildData(rawA2Text);
        this.data.B1 = buildData(rawB1Text);
        const d = Store.load();
        this.level = d.lastLevel in this.data ? d.lastLevel : 'A1';
        this.chapter = Math.min(24, Math.max(1, +d.lastChapter || 1));
        this.mode = MODES.some(m => m.id === d.lastMode) ? d.lastMode : 'cards';
        this.applyTheme();
        Speech.init();
        $('#settings-btn').innerHTML = icon('gear');
        this.renderInstallBtn();
        this.loadSession();
        document.addEventListener('click', e => this.onClick(e));
        document.addEventListener('keydown', e => this.onKey(e));
        this.render();
      },

      words(level = this.level, ch = this.chapter) { return this.data[level][ch] || []; },
      title(level = this.level, ch = this.chapter) { return CHAPTER_TITLES[level][ch - 1] || `Chapter ${ch}`; },
      chKey() { return `${this.level}_${this.chapter}`; },

      persist() { Store.d.levelChapter = Object.assign({}, Store.d.levelChapter, { [this.level]: this.chapter }); Object.assign(Store.d, { lastLevel: this.level, lastChapter: this.chapter, lastMode: this.mode }); Store.save(); },

      clearTimers() { this.timers.forEach(t => clearInterval(t)); this.timers = []; },

      /* ---------- Shell ---------- */
      render() {
        this.renderStreak();
        this.renderChapterCard();
        this.renderModes();
        this.renderPanel();
      },

      renderStreak() {
        const n = Store.liveStreak();
        const el = $('#streak');
        el.className = `chip streak ${n ? 'on' : ''}`;
        el.innerHTML = `${icon('flame')}<span>${n}</span>`;
        el.title = n ? `${n}-day streak` : 'Study today to start a streak';
      },

      applyTheme() {
        const t = Store.d.settings.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        $('meta[name="theme-color"]').content = t === 'light' ? '#f4f5f8' : '#0c0f16';

      },

      // Chapters are studied in parts: 3 parts under 50 words, 4 parts from 50 up.
      partLists(level = this.level, ch = this.chapter) {
        const list = this.words(level, ch), n = list.length, k = n >= 50 ? 4 : 3, out = [];
        for (let i = 0; i < k; i++) out.push(list.slice(Math.round(i * n / k), Math.round((i + 1) * n / k)));
        return out;
      },
      get part() {
        const p = (Store.d.chapterPart || {})[this.chKey()];
        return p == null ? 1 : p;
      },
      setPart(p) {
        this.stashSession();
        Store.d.chapterPart = Object.assign({}, Store.d.chapterPart, { [this.chKey()]: p });
        Store.save(); this.loadSession(); this.render();
      },

      // Your place in each part and mode is kept while you stay in the same chapter.
      sessKey() { return this.chKey() + '|' + this.part + '|' + this.mode; },
      stashSession() {
        // Sprint and Match are timed rounds: leaving one ends it.
        if (this.mode === 'sprint' || this.mode === 'match') return;
        this.sessions[this.sessKey()] = this.s;
      },
      loadSession() {
        const s = this.s = this.sessions[this.sessKey()] || (this.mode === 'cards' && this.restoreCards()) || {};
        // Coming back after answering: move on to the next question instead of a locked one.
        if (s.flipped) s.flipped = false;
        if (s.answered) { s.i++; s.answered = false; }
        if (s.done) { s.i++; s.done = false; }
        if (s.checked != null && s.qs) { s.i++; s.placed = []; s.checked = null; s.order = null; }
      },
      forgetSessions() { this.sessions = {}; Store.d.cardSession = null; Store.save(); },

      // Flashcard position is also saved to storage, so it survives the app being closed.
      saveCards() {
        const s = this.s;
        if (!s.deck) return;
        let cs = Store.d.cardSession;
        if (!cs || cs.ch !== this.chKey()) cs = Store.d.cardSession = { ch: this.chKey(), parts: {} };
        cs.parts[this.part] = {
          filter: s.filter, shuffled: s.shuffled, i: s.i, got: s.got, again: s.again,
          deck: s.deck.map(w => w.de), againList: s.againList.map(w => w.de),
        };
        Store.save();
      },
      restoreCards() {
        const cs = Store.d.cardSession;
        const d = cs && cs.ch === this.chKey() && cs.parts[this.part];
        if (!d) return null;
        const byKey = new Map(this.pool().map(w => [w.de, w]));
        const deck = d.deck.map(k => byKey.get(k)).filter(Boolean);
        if (!deck.length) return null;
        return {
          filter: d.filter || 'all', shuffled: !!d.shuffled, deck, i: Math.min(d.i || 0, deck.length), flipped: false,
          got: d.got || 0, again: d.again || 0, againList: (d.againList || []).map(k => byKey.get(k)).filter(Boolean),
        };
      },
      pool() { const p = this.part; return p ? (this.partLists()[p - 1] || this.words()) : this.words(); },
      poolName() { return this.part ? 'Part ' + this.part : 'this chapter'; },
      countList(list) {
        let learned = 0, hard = 0;
        for (const w of list) { const s = Store.status(w.de); if (s === 'learned') learned++; else if (s === 'hard') hard++; }
        return { total: list.length, learned, hard, fresh: list.length - learned - hard };
      },

      counts(level = this.level, ch = this.chapter) {
        const list = this.words(level, ch);
        let learned = 0, hard = 0;
        for (const w of list) { const s = Store.status(w.de); if (s === 'learned') learned++; else if (s === 'hard') hard++; }
        return { total: list.length, learned, hard, fresh: list.length - learned - hard };
      },

      levelPct(level) {
        let total = 0, learned = 0;
        for (let ch = 1; ch <= 24; ch++) { const c = this.counts(level, ch); total += c.total; learned += c.learned; }
        return total ? Math.round(learned / total * 100) : 0;
      },

      renderChapterCard() {
        const done = !!Store.d.completedChapters[this.chKey()];
        const tab = (lv, name) => `<button class="lv-tab ${this.level === lv ? 'on' : ''}" data-action="set-level" data-level="${lv}"><b>${lv}<em>${this.levelPct(lv)}%</em></b><small>${name}</small></button>`;
        const cards = Array.from({ length: 24 }, (_, i) => i + 1).map(ch => {
          const c = this.counts(this.level, ch), pct = c.total ? c.learned / c.total * 100 : 0;
          const isDone = Store.d.completedChapters[`${this.level}_${ch}`];
          return `<button class="cc ${ch === this.chapter ? 'on' : ''}" data-action="pick-ch" data-level="${this.level}" data-ch="${ch}">
              <span class="n">Chapter ${ch}${isDone ? icon('check') : `<span>${Math.round(pct)}%</span>`}</span>
              <span class="t">${esc(this.title(this.level, ch))}</span>
              <span class="bar"><i style="width:${pct}%"></i></span>
            </button>`;
        }).join('');

        const lists = this.partLists(), cur = this.part;
        let steps = '';
        lists.forEach((l, i) => {
          const c = this.countList(l), p = c.total ? Math.round(c.learned / c.total * 100) : 0, full = c.total && c.learned === c.total;
          if (i) steps += `<span class="ln ${full ? 'full' : ''}"></span>`;
          steps += `<button class="step ${cur === i + 1 ? 'on' : ''} ${full ? 'full' : ''}" style="--p:${p}" data-action="set-part" data-p="${i + 1}" aria-label="Part ${i + 1}, ${l.length} words, ${p}% mastered">
              <span class="ring"><span>${full && cur !== i + 1 ? icon('check') : i + 1}</span></span><small>Part ${i + 1}</small></button>`;
        });
        const all = this.countList(this.words()), allP = all.total ? Math.round(all.learned / all.total * 100) : 0;
        steps += `<span class="gap"></span><button class="step ${cur === 0 ? 'on' : ''}" style="--p:${allP}" data-action="set-part" data-p="0" aria-label="Whole chapter">
            <span class="ring"><span>${icon('list')}</span></span><small>All</small></button>`;

        const pc = this.countList(this.pool());
        $('#chapter-card').innerHTML = `
          <div class="lv-tabs">
            ${LEVELS.map(l => tab(l.id, l.name)).join('')}
            <button class="lv-all" data-action="chapters" aria-label="All chapters">${icon('grid')}<span class="lv-all-t">Chapters</span></button>
          </div>
          <div class="strip-wrap"><div class="strip" id="ch-strip">${cards}</div><span class="strip-hint"></span></div>
          <div class="cur">
            <div class="cur-head"><b>${cur ? `Part ${cur} of ${lists.length}` : 'Whole chapter'}</b><span>${cur ? 'words ' + this.chapterRange() : all.total + ' words'}</span></div>
            <div class="steps">${steps}</div>
            <div class="cur-info">
              <div class="cur-stats">
                <span><i class="dot" style="background:var(--ok)"></i><b>${pc.learned}</b> mastered</span>
                <span><i class="dot" style="background:var(--bad)"></i><b>${pc.hard}</b> still learning</span>
                <span><i class="dot" style="background:var(--surface-3)"></i><b>${pc.fresh}</b> new</span>
              </div>
              <button class="done-btn ${done ? 'on' : ''}" data-action="toggle-done">${done ? icon('check') + ' Chapter done' : 'Mark chapter done'}</button>
            </div>
          </div>`;
        const strip = $('#ch-strip'), act = strip.querySelector('.cc.on');
        if (act) strip.scrollLeft = act.offsetLeft - (strip.clientWidth - act.offsetWidth) / 2;
      },

      partsHtml() {
        const lists = this.partLists(), cur = this.part;
        const chips = lists.map((l, i) => {
          const c = this.countList(l), full = c.total && c.learned === c.total;
          return `<button class="part ${cur === i + 1 ? 'on' : ''}" data-action="set-part" data-p="${i + 1}">
              <b>Part ${i + 1}${full ? icon('check') : ''}</b><span>${l.length} words</span>
              <span class="pbar"><i style="width:${c.total ? c.learned / c.total * 100 : 0}%"></i></span>
            </button>`;
        }).join('');
        const all = this.countList(this.words());
        return `
          <div class="parts-head"><b>Study in parts</b><span>${cur ? 'words ' + this.chapterRange() : 'whole chapter'}</span></div>
          <div class="parts" style="grid-template-columns:repeat(${lists.length + 1}, minmax(0, 1fr))">
            ${chips}
            <button class="part ${cur === 0 ? 'on' : ''}" data-action="set-part" data-p="0">
              <b>All${all.total && all.learned === all.total ? icon('check') : ''}</b><span>${all.total} words</span>
              <span class="pbar"><i style="width:${all.total ? all.learned / all.total * 100 : 0}%"></i></span>
            </button>
          </div>`;
      },
      chapterRange() {
        const lists = this.partLists(); let a = 1;
        for (let i = 0; i < this.part - 1; i++) a += lists[i].length;
        return a + '–' + (a + lists[this.part - 1].length - 1);
      },

      renderModes() {
        const hard = this.countList(this.pool()).hard;
        $('#modes').innerHTML = MODES.map(m => `
          <button class="mode ${this.mode === m.id ? 'active' : ''}" data-action="mode" data-mode="${m.id}">
            ${icon(m.icon)}${m.label}${m.id === 'cards' && hard ? `<span class="badge">${hard}</span>` : ''}
          </button>`).join('');
        const act = $('#modes .mode.active');
        if (act) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      },

      renderPanel() {
        this.clearTimers();
        const p = $('#panel');
        p.style.animation = 'none'; p.offsetHeight; p.style.animation = '';
        const fn = { cards: 'renderCards', quiz: 'renderQuiz', type: 'renderType', articles: 'renderArticles', match: 'renderMatch', sprint: 'renderSprint', sentences: 'renderSentences', words: 'renderWords' }[this.mode];
        this[fn](p);
      },

      refreshStats() { this.renderStreak(); this.renderChapterCard(); this.renderModes(); },

      setChapter(level, ch, stay) {
        if (level !== this.level || ch !== this.chapter) this.forgetSessions();
        else this.stashSession();
        this.level = level; this.chapter = ch; this.loadSession();
        this.persist(); this.render();
        if (!stay) window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      setMode(m) { this.stashSession(); this.mode = m; this.loadSession(); this.persist(); this.renderModes(); this.renderPanel(); },

      toast(msg) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3500);
      },

      /* ---------- Events ---------- */
      onClick(e) {
        const el = e.target.closest('[data-action]');
        if (!el || el.disabled) return;
        const a = el.dataset.action, ds = el.dataset;
        switch (a) {
          case 'mode': return this.setMode(ds.mode);
          case 'chapters': return this.openChapters(this.level);
          case 'sheet-level': return this.openChapters(ds.level);
          case 'set-level': if (ds.level === this.level) return; this.toast(ds.level + ' selected'); return this.setChapter(ds.level, (Store.d.levelChapter || {})[ds.level] || 1);
          case 'pick-ch': { const fromSheet = !!$('#overlay').firstChild; this.closeSheet(); if (!fromSheet && +ds.ch === this.chapter && ds.level === this.level) return; return this.setChapter(ds.level, +ds.ch, !fromSheet); }
          case 'ch-step': return this.setChapter(this.level, Math.min(24, Math.max(1, this.chapter + +ds.dir)));
          case 'close-sheet': if (el.classList.contains('scrim') && e.target !== el) return; return this.closeSheet();
          case 'set-part': return this.setPart(+ds.p);
          case 'toggle-done': {
            const k = this.chKey();
            Store.d.completedChapters[k] = !Store.d.completedChapters[k]; Store.save();
            if (Store.d.completedChapters[k]) this.toast('Nice! Chapter marked as done');
            return this.renderChapterCard();
          }
          case 'theme': {
            Store.d.settings.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            Store.save(); this.applyTheme();
            if ($('#overlay').firstChild) this.openSettings();
            return;
          }
          case 'settings': return this.openSettings();
          case 'set-toggle': {
            Store.d.settings[ds.key] = !Store.d.settings[ds.key]; Store.save();
            el.classList.toggle('on', Store.d.settings[ds.key]); return;
          }
          case 'check-update': return this.checkUpdate(el);
          case 'install': return this.openInstall();
          case 'install-os': return this.openInstall(ds.os);
          case 'install-now': {
            if (!this.installPrompt) return;
            this.installPrompt.prompt();
            this.installPrompt.userChoice.finally(() => { this.installPrompt = null; this.closeSheet(); });
            return;
          }
          case 'do-update': return location.reload();
          case 'export': return this.exportProgress();
          case 'import': return $('#import-file').click();
          case 'reset-all': {
            if (!confirm('Reset ALL progress (mastered words, practice list, streak)? This cannot be undone.')) return;
            Object.assign(Store.d, { completedChapters: {}, learnedWords: {}, difficultWords: {}, streak: { day: null, count: 0 }, best: {} });
            Store.save(); this.closeSheet(); this.forgetSessions(); this.s = {}; this.render(); return this.toast('Progress reset');
          }
          case 'speak': e.stopPropagation(); return Speech.say(ds.text);
        }
        const h = this[`on_${this.mode}`];
        if (h) h.call(this, a, el, e);
      },

      onKey(e) {
        if ($('#overlay').firstChild) { if (e.key === 'Escape') this.closeSheet(); return; }
        const typing = e.target.matches('input, textarea');
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const h = this[`key_${this.mode}`];
        if (h) h.call(this, e, typing);
      },

      /* ---------- Sheets ---------- */
      openSheet(html) {
        $('#overlay').innerHTML = `<div class="scrim" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grab"></div>${html}</div></div>`;
        document.body.style.overflow = 'hidden';
      },
      closeSheet() { $('#overlay').innerHTML = ''; document.body.style.overflow = ''; },

      openChapters(level) {
        const items = Array.from({ length: 24 }, (_, i) => i + 1).map(ch => {
          const c = this.counts(level, ch);
          const pct = c.total ? Math.round(c.learned / c.total * 100) : 0;
          const done = Store.d.completedChapters[`${level}_${ch}`];
          const cur = level === this.level && ch === this.chapter;
          return `<button class="ch-item ${done ? 'done' : ''} ${cur ? 'cur' : ''}" data-action="pick-ch" data-level="${level}" data-ch="${ch}">
              <span class="ch-num">${done ? icon('check') : ch}</span>
              <span><span class="t">${esc(this.title(level, ch))}</span><span class="mini" style="display:block"><i style="width:${pct}%"></i></span></span>
              <span class="pct">${pct}%</span>
            </button>`;
        }).join('');
        this.openSheet(`
          <div class="sheet-head">
            <h3>Chapters</h3>
            <div class="seg">
              ${LEVELS.map(l => `<button class="${level === l.id ? 'on' : ''}" data-action="sheet-level" data-level="${l.id}">${l.id}</button>`).join('')}
            </div>
          </div>
          <div class="sheet-body"><div class="ch-list">${items}</div></div>`);
        const cur = $('.ch-item.cur');
        if (cur) cur.scrollIntoView({ block: 'center' });
      },

      isStandalone() {
        return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
      },
      renderInstallBtn() {
        const b = $('#install-btn');
        if (!b) return;
        if (this.isStandalone()) return b.remove();
        b.innerHTML = icon('phoneDl') + (Store.d.seenInstall ? '' : '<span class="nd"></span>');
      },
      openInstall(os) {
        if (!Store.d.seenInstall) { Store.d.seenInstall = true; Store.save(); this.renderInstallBtn(); }
        const ua = navigator.userAgent;
        const isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        os = os || (isIOS ? 'ios' : 'android');
        const g = n => `<span class="glyph">${icon(n)}</span>`;
        const li = (n, html) => `<li><span class="num">${n}</span><span>${html}</span></li>`;
        const finish = n => li(n, `Open <b>glitch deutsch</b> from its new icon. In ${g('gear')} Settings, <b>Works offline</b> should show a green dot.`);

        const body = os === 'ios' ? `
            <ol class="inst-list">
              ${li(1, `Open this page in <b>Safari</b>. (Chrome on iPhone can do it too, via its ${g('share')} button.)`)}
              ${li(2, `Tap the <b>page menu</b> button ${g('pageMenu')} on the left of the address bar at the bottom. (With a different Safari layout it looks like ${g('more')} instead.)`)}
              ${li(3, `Tap <b>Share</b> ${g('share')}. (On older iPhones there's no menu button — the Share button ${g('share')} is right in the bottom bar, so start here.)`)}
              ${li(4, `Scroll down the list and tap <b>Add to Home Screen</b> ${g('plusSq')}. Not there? Tap <b>Edit Actions</b> at the very bottom and add it.`)}
              ${li(5, `Leave <b>Open as Web App</b> switched on (it's on by default), then tap <b>Add</b>.`)}
              ${finish(6)}
            </ol>
            <div class="inst-note">Always open it from the icon, not a Safari tab — your progress is saved separately in each.</div>`
          : `
            ${this.installPrompt ? `<button class="btn btn-primary btn-lg" style="width:100%;margin-bottom:6px" data-action="install-now">${icon('phoneDl')} Install now</button>
              <p class="muted small" style="text-align:center;margin-bottom:4px">One tap — or follow the steps below.</p>` : ''}
            <div class="inst-sub">Samsung Internet</div>
            <ol class="inst-list">
              ${li(1, `Open this page in <b>Samsung Internet</b>.`)}
              ${li(2, `Tap the <b>menu</b> ${g('menu')} at the bottom right.`)}
              ${li(3, `Tap <b>Add page to</b> → <b>Home screen</b>, then <b>Add</b>. (If an install icon ${g('phoneDl')} shows in the address bar, you can tap that instead.)`)}
            </ol>
            <div class="inst-sub">Chrome</div>
            <ol class="inst-list">
              ${li(1, `Tap the <b>menu</b> ${g('dots')} at the top right.`)}
              ${li(2, `Tap <b>Install and create shortcut</b> — on older Chrome it's called <b>Add to Home screen</b> or <b>Install app</b>. Then tap <b>Install</b>.`)}
            </ol>
            <ol class="inst-list" style="margin-top:8px">${finish('✓')}</ol>
            <div class="inst-note">Always open it from the icon — your progress is saved separately in the app and in the browser.</div>`;

        this.openSheet(`
          <div class="sheet-head"><h3>Add to Home Screen</h3><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
          <div class="sheet-body">
            <p class="inst-intro">Install glitch deutsch like a real app: its own icon, full screen, and it works without internet.</p>
            ${this.isStandalone() ? `<div class="inst-note" style="margin:0 0 14px">✅ You're already using the Home Screen app on this phone. These steps are here if you want to help someone else install it.</div>` : ''}
            ${`<div class="inst-tabs"><div class="seg">
              <button class="${os === 'ios' ? 'on' : ''}" data-action="install-os" data-os="ios">iPhone / iPad</button>
              <button class="${os === 'android' ? 'on' : ''}" data-action="install-os" data-os="android">Samsung / Android</button>
            </div></div>`}
            ${body}
          </div>`);
      },

      openSettings() {
        const st = Store.d.settings;
        const allLearned = Object.keys(Store.d.learnedWords).length;
        const allHard = Object.keys(Store.d.difficultWords).length;
        this.openSheet(`
          <div class="sheet-head"><h3>Settings</h3><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
          <div class="sheet-body">
            <div class="set-row"><div class="lbl"><b>Add to Home Screen</b><span>${this.isStandalone() ? 'Installed ✓ — open the guide to help someone else' : 'Use it like an app, even offline'}</span></div>
              <button class="btn btn-sm ${this.isStandalone() ? '' : 'btn-primary'}" data-action="install">${this.isStandalone() ? 'Open guide' : 'Show me how'}</button></div>
            <div class="set-row"><div class="lbl"><b>Appearance</b><span>${document.documentElement.dataset.theme === 'light' ? 'Light' : 'Dark'} mode</span></div>
              <button class="btn btn-sm" data-action="theme">${icon(document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun')} Switch to ${document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'}</button></div>
            <div class="set-row"><div class="lbl"><b>Speak German automatically</b><span>Read each German word aloud on flashcards${Speech.ok ? '' : ' (not supported on this device)'}</span></div>
              <button class="toggle ${st.autoSpeak ? 'on' : ''}" data-action="set-toggle" data-key="autoSpeak" aria-label="Auto speak"></button></div>
            <div class="set-row"><div class="lbl"><b>App version ${APP_VERSION}</b><span id="update-status">Updates install automatically when you're online</span></div>
              <button class="btn btn-sm" data-action="check-update">Check for updates</button></div>
            <div class="set-row"><div class="lbl"><b>Works offline</b><span id="offline-status">Checking…</span></div><span id="offline-dot" class="dot" style="width:12px;height:12px;margin:0;background:var(--surface-3)"></span></div>
            <div class="set-row"><div class="lbl"><b>Your progress</b><span>${allLearned} words mastered · ${allHard} still learning · ${Store.liveStreak()}-day streak</span></div></div>
            <div class="set-row"><div class="lbl"><b>Back up progress</b><span>Save a file, or restore from one on another device</span></div>
              <div class="btn-row"><button class="btn btn-sm" data-action="export">Export</button><button class="btn btn-sm" data-action="import">Import</button></div></div>
            <div class="set-row"><div class="lbl"><b>Reset everything</b><span>Clears mastered words, practice list and streak</span></div>
              <button class="btn btn-sm btn-bad" data-action="reset-all">Reset</button></div>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>`);
        $('#import-file').addEventListener('change', e => this.importProgress(e.target.files[0]));
        this.checkOffline();
      },

      // Reads the version number of the copy on the website (null when offline).
      async remoteVersion() {
        try {
          const t = await (await fetch('./index.html?v=' + Date.now(), { cache: 'no-store' })).text();
          const m = t.match(/const APP_VERSION = (\d+);/);
          return m ? +m[1] : null;
        } catch (e) { return null; }
      },
      async checkUpdate(btn) {
        const st = $('#update-status');
        btn.disabled = true; btn.textContent = 'Checking…';
        const v = await this.remoteVersion();
        btn.disabled = false; btn.textContent = 'Check for updates';
        if (v == null) { if (st) st.textContent = 'Could not check — are you online?'; return; }
        if (v > APP_VERSION) {
          if (st) st.textContent = 'Updating to version ' + v + '…';
          try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
          return location.reload();
        }
        if (st) st.textContent = "You're up to date ✓";
      },
      showUpdateBar() {
        if ($('.update-bar')) return;
        const bar = document.createElement('div');
        bar.className = 'update-bar';
        bar.innerHTML = '<span>A new version is ready</span><button data-action="do-update">Update</button>';
        document.body.appendChild(bar);
      },

      async checkOffline() {
        const set = (ok, msg) => { const t = $('#offline-status'), d = $('#offline-dot'); if (!t) return; t.textContent = msg; d.style.background = ok ? 'var(--ok)' : 'var(--bad)'; };
        if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return set(false, 'Only works from the web link (8glitchh.github.io)');
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          const keys = window.caches ? await caches.keys() : [];
          if (reg && reg.active && keys.length) set(true, 'Ready — you can use it without internet');
          else set(false, 'Not ready yet — keep it open with internet for a few seconds');
        } catch (e) { set(false, 'Not available in this browser mode'); }
      },

      exportProgress() {
        const blob = new Blob([JSON.stringify(Store.d, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `glitch-deutsch-progress-${dayKey()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      },

      importProgress(file) {
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (!d || typeof d.learnedWords !== 'object') throw 0;
            localStorage.setItem(Store.KEY, JSON.stringify(d));
            Store.load(); this.closeSheet(); this.applyTheme(); this.forgetSessions(); this.s = {}; this.render();
            this.toast('Progress imported');
          } catch (e) { alert('That file is not a Glitch Deutsch backup.'); }
        };
        r.readAsText(file);
      },

      /* ---------- Shared bits ---------- */
      wordExtra(w) {
        const bits = [];
        if (w.plural) bits.push(`Pl. <b>${esc(w.plural)}</b>`);
        if (w.forms) bits.push(esc(w.forms));
        if (w.note) bits.push(esc(w.note));
        return bits.join(' · ');
      },
      deHtml(w) {
        return w.article ? `<span class="art">${w.article}</span> ${esc(w.noun)}` : esc(w.de);
      },
      speakBtn(text) { return Speech.ok ? `<button class="speak" data-action="speak" data-text="${esc(text)}" aria-label="Listen">${icon('speaker')}</button>` : ''; },
      emptyState(msg) { return `<div class="empty">${msg}</div>`; },
      distractors(w, n, field, pool) {
        pool = (pool || this.words()).filter(x => x[field] !== w[field]);
        const same = pool.filter(x => !!x.article === !!w.article);
        const out = pick(same.length >= n ? same : pool, n).map(x => x[field]);
        return [...new Set(out)];
      },
      recordBest(key, val, higherIsBetter = true) {
        const k = this.bestKey(key), prev = Store.d.best[k];
        const better = prev == null || (higherIsBetter ? val > prev : val < prev);
        if (better) { Store.d.best[k] = val; Store.save(); }
        return { prev, better };
      },
      getBest(key) { return Store.d.best[this.bestKey(key)]; },
      bestKey(key) { return `${this.chKey()}${this.part ? '_p' + this.part : ''}_${key}`; },

      /* ================= 1. Flashcards ================= */
      buildDeck() {
        const s = this.s;
        let list = this.pool();
        if (s.filter === 'hard') list = list.filter(w => Store.status(w.de) === 'hard');
        if (s.filter === 'new') list = list.filter(w => Store.status(w.de) === 'new');
        if (s.shuffled) list = shuffle(list);
        Object.assign(s, { deck: list, i: 0, flipped: false, got: 0, again: 0, againList: [] });
      },

      renderCards(p) {
        const s = this.s;
        if (!s.deck) { s.filter = s.filter || 'all'; s.shuffled = !!s.shuffled; this.buildDeck(); }
        this.saveCards();
        const dir = Store.d.settings.dir;
        const c = this.countList(this.pool());
        const head = `
          <div class="panel-head">
            <div class="seg" role="tablist">
              <button class="${s.filter === 'all' ? 'on' : ''}" data-action="c-filter" data-f="all">All ${c.total}</button>
              <button class="${s.filter === 'new' ? 'on' : ''}" data-action="c-filter" data-f="new">New ${c.fresh}</button>
              <button class="${s.filter === 'hard' ? 'on' : ''}" data-action="c-filter" data-f="hard">Learning ${c.hard}</button>
            </div>
            <div class="btn-row">
              <button class="btn btn-sm ${s.shuffled ? 'btn-primary' : ''}" data-action="c-shuffle" title="Mix the cards into a random order">${icon('shuffle')} ${s.shuffled ? 'Shuffled' : 'Shuffle'}</button>
              <button class="btn btn-sm" data-action="c-dir" title="Show German first or English first">${icon('swap')} ${dir === 'de-en' ? 'DE → EN' : 'EN → DE'}</button>
            </div>
          </div>`;

        if (!s.deck.length) {
          const msg = s.filter === 'hard'
            ? `<div class="summary"><div class="big">🎉</div><h2>Nothing left to learn</h2><p>No words in ${this.poolName()} are marked “still learning”.</p><button class="btn btn-primary" data-action="c-filter" data-f="all">Study all words</button></div>`
            : s.filter === 'new'
            ? `<div class="summary"><div class="big">✨</div><h2>No new words left</h2><p>You’ve seen every word in ${this.poolName()}.</p><button class="btn btn-primary" data-action="c-filter" data-f="all">Review all words</button></div>`
            : this.emptyState('No vocabulary in this chapter.');
          return p.innerHTML = head + msg;
        }

        if (s.i >= s.deck.length) {
          const perfect = s.again === 0;
          return p.innerHTML = head + `
            <div class="summary">
              <div class="big">${perfect ? '🏆' : '💪'}</div>
              <h2>${perfect ? 'Perfect round!' : 'Round complete'}${this.part ? ' · Part ' + this.part : ''}</h2>
              <p>${perfect ? 'You knew every card.' : 'Go again with just the cards you missed.'}</p>
              <div class="stat-row">
                <div class="stat"><b style="color:var(--ok)">${s.got}</b><span>Got it</span></div>
                <div class="stat"><b style="color:var(--bad)">${s.again}</b><span>Still learning</span></div>
              </div>
              <div class="btn-row">
                ${s.again ? `<button class="btn btn-primary" data-action="c-again">${icon('restart')} Go over ${s.again} again</button>` : ''}
                <button class="btn" data-action="c-restart">Start over</button>
                ${this.part && this.part < this.partLists().length ? `<button class="btn ${s.again ? '' : 'btn-primary'}" data-action="set-part" data-p="${this.part + 1}">Next: Part ${this.part + 1} ${icon('right')}</button>` : ''}
              </div>
            </div>`;
        }

        const w = s.deck[s.i];
        const deFace = `
          <div class="fface-mid">
            ${w.article ? `<span class="gtag">${{ der: 'masculine', die: 'feminine', das: 'neuter' }[w.article]}</span>` : ''}
            <div class="fword">${this.deHtml(w)}</div>
            ${this.wordExtra(w) ? `<div class="fsub">${this.wordExtra(w)}</div>` : ''}
          </div>`;
        const enFace = `<div class="fface-mid"><div class="fword">${esc(w.en)}</div></div>`;
        const [front, back] = dir === 'de-en' ? [deFace, enFace] : [enFace, deFace];
        const [fl, bl] = dir === 'de-en' ? ['German', 'English'] : ['English', 'German'];
        const status = Store.status(w.de);

        p.innerHTML = head + `
          <div class="deck-bar"><i style="width:${s.i / s.deck.length * 100}%"></i></div>
          <div class="card-stage">
            <div class="fcard ${s.flipped ? 'flipped' : ''} ${gClass(w)}" id="fcard" data-action="c-flip">
              <span class="swipe-tag l">STILL LEARNING</span><span class="swipe-tag r">GOT IT</span>
              <div class="fface ${dir === 'de-en' && w.article ? 'g' : ''}">
                <div class="fface-top"><span>${fl}</span>${dir === 'de-en' ? this.speakBtn(w.de) : `<span>${status === 'hard' ? '⚠ still learning' : status === 'learned' ? '✓ mastered' : ''}</span>`}</div>
                ${front}
                <div class="fhint">Tap to reveal</div>
              </div>
              <div class="fface back ${dir === 'en-de' && w.article ? 'g' : ''}">
                <div class="fface-top"><span>${bl}</span>${dir === 'en-de' ? this.speakBtn(w.de) : ''}</div>
                ${back}
                <div class="fhint">Did you know it?</div>
              </div>
            </div>
          </div>
          <div class="rate">
            <button class="btn btn-lg btn-bad" data-action="c-rate" data-r="hard">${icon('x')} Still learning</button>
            <button class="btn btn-lg btn-ok" data-action="c-rate" data-r="learned">${icon('check')} Got it</button>
          </div>
          <div class="deck-nav">
            <button class="btn btn-sm btn-ghost" data-action="c-step" data-d="-1" ${s.i === 0 ? 'disabled style="opacity:.4"' : ''}>${icon('left')} Back</button>
            <span class="deck-mid">
              <span class="muted small" style="font-variant-numeric:tabular-nums">${s.i + 1} / ${s.deck.length}</span>
              <button class="btn btn-sm btn-ghost" data-action="c-reset-open" title="Clear this part's marks and start it again from the first card">${icon('restart')} Restart</button>
            </span>
            <button class="btn btn-sm btn-ghost" data-action="c-step" data-d="1">Skip ${icon('right')}</button>
          </div>
          <div class="kbd-hint"><kbd>Space</kbd> flip · <kbd>←</kbd> still learning · <kbd>→</kbd> got it · <kbd>S</kbd> speak · or swipe the card</div>`;

        this.attachSwipe($('#fcard'));
        if (Store.d.settings.autoSpeak && (dir === 'de-en' ? !s.flipped : s.flipped)) Speech.say(w.de);
      },

      flipCard() {
        const s = this.s, el = $('#fcard');
        if (!el) return;
        s.flipped = !s.flipped;
        el.classList.toggle('flipped', s.flipped);
        if (s.flipped && Store.d.settings.autoSpeak && Store.d.settings.dir === 'en-de') Speech.say(s.deck[s.i].de);
      },

      rateCard(r) {
        const s = this.s, w = s.deck[s.i];
        if (!w) return;
        Store.setStatus(w.de, r);
        if (r === 'learned') s.got++; else { s.again++; s.againList.push(w); }
        s.i++; s.flipped = false;
        this.refreshStats(); this.renderCards($('#panel'));
      },

      attachSwipe(el) {
        let x0 = null, y0 = null, dx = 0, moved = false;
        const tagL = el.querySelector('.swipe-tag.l'), tagR = el.querySelector('.swipe-tag.r');
        el.addEventListener('pointerdown', e => { if (e.target.closest('.speak')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; });
        el.addEventListener('pointermove', e => {
          if (x0 == null) return;
          dx = e.clientX - x0;
          if (!moved && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(e.clientY - y0)) { moved = true; el.classList.add('dragging'); try { el.setPointerCapture(e.pointerId); } catch (_) {} }
          if (moved) {
            const flip = this.s.flipped ? ' rotateY(180deg)' : '';
            el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)${flip}`;
            tagL.style.opacity = Math.max(0, -dx / 100); tagR.style.opacity = Math.max(0, dx / 100);
          }
        });
        const end = () => {
          if (x0 == null) return;
          x0 = null;
          if (!moved) return;
          el.classList.remove('dragging');
          el.dataset.swiped = '1'; setTimeout(() => delete el.dataset.swiped, 50);
          if (Math.abs(dx) > 90) return this.rateCard(dx > 0 ? 'learned' : 'hard');
          el.style.transform = ''; tagL.style.opacity = tagR.style.opacity = 0;
        };
        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
      },

      on_cards(a, el) {
        const s = this.s;
        if (a === 'c-flip') { if (el.dataset.swiped) return; return this.flipCard(); }
        if (a === 'c-rate') return this.rateCard(el.dataset.r);
        if (a === 'c-step') { s.i = Math.max(0, s.i + +el.dataset.d); s.flipped = false; return this.renderCards($('#panel')); }
        if (a === 'c-filter') {
          const f = el.dataset.f;
          if (f === s.filter) return;
          if (s.filter === 'all') s.savedAll = { deck: s.deck, i: s.i, got: s.got, again: s.again, againList: s.againList, shuffled: s.shuffled };
          s.filter = f;
          if (f === 'all' && s.savedAll && s.savedAll.shuffled === s.shuffled) { Object.assign(s, s.savedAll, { flipped: false }); s.savedAll = null; }
          else this.buildDeck();
          return this.renderCards($('#panel'));
        }
        if (a === 'c-shuffle') { s.shuffled = !s.shuffled; s.savedAll = null; this.buildDeck(); this.toast(s.shuffled ? 'Cards shuffled into random order' : 'Cards back in normal order'); return this.renderCards($('#panel')); }
        if (a === 'c-dir') { Store.d.settings.dir = Store.d.settings.dir === 'de-en' ? 'en-de' : 'de-en'; Store.save(); s.flipped = false; this.toast(Store.d.settings.dir === 'de-en' ? 'German first, then English' : 'English first, then German'); return this.renderCards($('#panel')); }
        if (a === 'c-restart') { s.savedAll = null; this.buildDeck(); return this.renderCards($('#panel')); }
        if (a === 'c-reset-open') {
          for (const w of this.pool()) { delete Store.d.learnedWords[w.de]; delete Store.d.difficultWords[w.de]; }
          Store.save();
          s.filter = 'all'; s.savedAll = null;
          this.buildDeck();
          this.refreshStats();
          this.toast((this.part ? 'Part ' + this.part : 'Chapter') + ' restarted');
          return this.renderCards($('#panel'));
        }
        if (a === 'c-again') { const list = s.shuffled ? shuffle(s.againList) : s.againList; Object.assign(s, { deck: list, i: 0, flipped: false, got: 0, again: 0, againList: [] }); return this.renderCards($('#panel')); }
      },
      key_cards(e, typing) {
        if (typing || !this.s.deck || this.s.i >= this.s.deck.length) return;
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); this.flipCard(); }
        else if (e.key === 'ArrowLeft' || e.key === '1') this.rateCard('hard');
        else if (e.key === 'ArrowRight' || e.key === '2') this.rateCard('learned');
        else if (e.key.toLowerCase() === 's') Speech.say(this.s.deck[this.s.i].de);
      },

      /* ================= 2. Quiz (multiple choice) ================= */
      renderQuiz(p) {
        const s = this.s, list = this.pool();
        if (list.length < 4) return p.innerHTML = this.emptyState('This part needs at least 4 words for a quiz.');
        if (!s.qs) {
          const src = s.retry || pick(list, Math.min(10, list.length));
          s.qs = src.map(w => {
            const toEn = Math.random() < 0.5;
            const field = toEn ? 'en' : 'de';
            return { w, toEn, answer: w[field], opts: shuffle([w[field], ...this.distractors(w, 3, field)]) };
          });
          Object.assign(s, { i: 0, score: 0, missed: [], answered: false, retry: null });
        }
        if (s.i >= s.qs.length) {
          const pctv = Math.round(s.score / s.qs.length * 100);
          const { better, prev } = this.recordBest('quiz', pctv);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${pctv === 100 ? '🏆' : pctv >= 70 ? '🎯' : '📚'}</div>
              <h2>${s.score} / ${s.qs.length} correct</h2>
              <p>${better && prev != null ? 'New personal best for this chapter!' : pctv === 100 ? 'Flawless.' : 'Missed words were added to “Still learning”.'}</p>
              ${s.missed.length ? `<div class="wlist" style="text-align:left;margin:0 auto 22px;max-width:460px">${s.missed.map(w => `
                <div class="wrow ${gClass(w)}"><span class="bar"></span><div><div class="de">${this.deHtml(w)}</div><div class="en">${esc(w.en)}</div></div><span></span></div>`).join('')}</div>` : ''}
              <div class="btn-row">
                ${s.missed.length ? `<button class="btn btn-primary" data-action="q-retry">${icon('restart')} Retry ${s.missed.length} missed</button>` : ''}
                <button class="btn" data-action="q-new">New quiz</button>
              </div>
            </div>`;
        }
        const q = s.qs[s.i];
        p.innerHTML = `
          <div class="q-meta"><span>Question ${s.i + 1} / ${s.qs.length}</span><span style="color:var(--ok)">${s.score} correct</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.qs.length * 100}%"></i></div>
          <div class="q-prompt">
            <div class="q-label">${q.toEn ? 'What does this mean?' : 'How do you say this in German?'}</div>
            <div class="q-word ${gClass(q.w)}">${q.toEn ? this.deHtml(q.w) + this.speakBtn(q.w.de) : esc(q.w.en)}</div>
          </div>
          <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-action="q-ans" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
          <div id="fb"></div>
          <div class="kbd-hint"><kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>Enter</kbd> next</div>`;
      },
      answerQuiz(i) {
        const s = this.s, q = s.qs[s.i];
        if (s.answered || !q) return;
        s.answered = true;
        const btns = [...document.querySelectorAll('.opt')];
        btns.forEach(b => b.disabled = true);
        const correct = q.opts[i] === q.answer;
        btns.forEach((b, j) => { if (q.opts[j] === q.answer) b.classList.add('correct'); });
        if (correct) s.score++;
        else { btns[i].classList.add('wrong'); s.missed.push(q.w); Store.setStatus(q.w.de, 'hard'); this.refreshStats(); }
        $('#fb').innerHTML = `<div class="feedback ${correct ? 'ok' : 'bad'}">
          <span class="fb-text">${correct ? 'Correct!' : 'Not quite'}<small>${this.deHtml(q.w)} = ${esc(q.w.en)}</small></span>
          <button class="btn btn-sm btn-primary" data-action="q-next">Next ${icon('right')}</button></div>`;
        if (correct) setTimeout(() => { if (this.s === s && s.answered && s.qs[s.i] === q) this.nextQuiz(); }, 900);
      },
      nextQuiz() { const s = this.s; s.i++; s.answered = false; this.renderQuiz($('#panel')); },
      on_quiz(a, el) {
        if (a === 'q-ans') return this.answerQuiz(+el.dataset.i);
        if (a === 'q-next') return this.nextQuiz();
        if (a === 'q-retry') { const m = this.s.missed; this.s = { retry: shuffle(m) }; return this.renderQuiz($('#panel')); }
        if (a === 'q-new') { this.s = {}; return this.renderQuiz($('#panel')); }
      },
      key_quiz(e, typing) {
        if (typing || !this.s.qs) return;
        if (/^[1-4]$/.test(e.key)) this.answerQuiz(+e.key - 1);
        else if (e.key === 'Enter' && this.s.answered) this.nextQuiz();
      },

      /* ================= 3. Write (type the German) ================= */
      norm(t) { return t.toLowerCase().replace(/[.,!?¿¡;:"“”„]/g, '').replace(/\s+/g, ' ').trim(); },
      fold(t) { return this.norm(t).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss'); },
      renderType(p) {
        const s = this.s, list = this.pool();
        if (!list.length) return p.innerHTML = this.emptyState('No vocabulary in this chapter.');
        if (!s.qs) Object.assign(s, { qs: s.retry || pick(list, Math.min(10, list.length)), i: 0, score: 0, missed: [], done: false, retry: null });
        if (s.i >= s.qs.length) {
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${s.score === s.qs.length ? '🏆' : '✍️'}</div>
              <h2>${s.score} / ${s.qs.length} spelled right</h2>
              <p>Correct answers count as mastered; mistakes go to “Still learning”.</p>
              <div class="btn-row">
                ${s.missed.length ? `<button class="btn btn-primary" data-action="t-retry">${icon('restart')} Retry ${s.missed.length} missed</button>` : ''}
                <button class="btn" data-action="t-new">New round</button>
              </div>
            </div>`;
        }
        const w = s.qs[s.i];
        p.innerHTML = `
          <div class="q-meta"><span>Word ${s.i + 1} / ${s.qs.length}</span><span style="color:var(--ok)">${s.score} correct</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.qs.length * 100}%"></i></div>
          <div class="q-prompt">
            <div class="q-label">Write in German${w.article ? ' — include the article' : ''}</div>
            <div class="q-word">${esc(w.en)}</div>
            ${w.note ? `<div class="muted small" style="margin-top:6px">(${esc(w.note)})</div>` : ''}
          </div>
          <form class="type-box" id="type-form" autocomplete="off">
            <input class="type-input" id="type-in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type here…" aria-label="Your answer">
            <button class="btn btn-primary btn-lg" type="submit" id="type-go">Check</button>
          </form>
          <div class="umlauts">${['ä', 'ö', 'ü', 'ß'].map(c => `<button type="button" data-action="t-char" data-c="${c}">${c}</button>`).join('')}</div>
          <div id="fb"></div>
          <div class="kbd-hint"><kbd>Enter</kbd> check / next · leave empty and press Enter to reveal</div>`;
        const inp = $('#type-in');
        $('#type-form').addEventListener('submit', e => { e.preventDefault(); s.done ? this.nextType() : this.checkType(); });
        setTimeout(() => inp.focus({ preventScroll: true }), 30);
      },
      checkType() {
        const s = this.s, w = s.qs[s.i], inp = $('#type-in');
        const val = inp.value;
        const alts = w.de.split(/\s*\/\s*/).concat(w.de);
        let result = 'bad';
        if (val.trim()) {
          if (alts.some(a => this.norm(a) === this.norm(val))) result = 'ok';
          else if (alts.some(a => this.fold(a) === this.fold(val))) result = 'ok-umlaut';
          else if (w.article && this.norm(val) === this.norm(w.noun)) result = 'no-article';
        }
        s.done = true;
        inp.readOnly = true;
        const good = result === 'ok' || result === 'ok-umlaut';
        inp.classList.add(good ? 'ok' : 'bad');
        if (good) { s.score++; Store.setStatus(w.de, 'learned'); }
        else if (result !== 'no-article') { s.missed.push(w); Store.setStatus(w.de, 'hard'); }
        else s.missed.push(w);
        this.refreshStats();
        const msg = {
          'ok': ['ok', 'Richtig!', ''],
          'ok-umlaut': ['ok', 'Correct — mind the spelling', `Exact form: ${esc(w.de)}`],
          'no-article': ['meh', `Almost — don't forget the article`, `<span class="${gClass(w)}">${this.deHtml(w)}</span>`],
          'bad': ['bad', val.trim() ? 'Not quite' : 'Answer', `<span class="${gClass(w)}">${this.deHtml(w)}</span>${w.plural ? ` · Pl. ${esc(w.plural)}` : ''}`],
        }[result];
        $('#type-go').textContent = 'Next';
        $('#fb').innerHTML = `<div class="feedback ${msg[0]}"><span class="fb-text">${msg[1]}${msg[2] ? `<small>${msg[2]}</small>` : ''}</span>${this.speakBtn(w.de)}</div>`;
        if (Store.d.settings.autoSpeak) Speech.say(w.de);
      },
      nextType() { const s = this.s; s.i++; s.done = false; this.renderType($('#panel')); },
      on_type(a, el) {
        if (a === 't-char') {
          const inp = $('#type-in'); if (!inp || inp.readOnly) return;
          const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? st;
          inp.value = inp.value.slice(0, st) + el.dataset.c + inp.value.slice(en);
          inp.focus(); inp.setSelectionRange(st + 1, st + 1); return;
        }
        if (a === 't-retry') { const m = this.s.missed; this.s = { retry: shuffle(m) }; return this.renderType($('#panel')); }
        if (a === 't-new') { this.s = {}; return this.renderType($('#panel')); }
      },
      key_type(e, typing) {
        if (!typing && e.key === 'Enter' && this.s.done) this.nextType();
      },

      /* ================= 4. der / die / das ================= */
      renderArticles(p) {
        const s = this.s;
        const nouns = this.pool().filter(w => w.article);
        if (nouns.length < 3) return p.innerHTML = this.emptyState((this.part ? 'This part' : 'This chapter') + ' has too few nouns for the article trainer.' + (this.part ? ' Try another part, or “All”.' : ''));
        if (!s.deck) Object.assign(s, { deck: shuffle(nouns), i: 0, score: 0, streak: 0, bestStreak: 0, answered: false });
        if (s.i >= s.deck.length) {
          const { better } = this.recordBest('articles', s.bestStreak);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${s.score === s.deck.length ? '🏆' : '🏷️'}</div>
              <h2>${s.score} / ${s.deck.length} articles right</h2>
              <p>Longest streak: <b>${s.bestStreak}</b>${better ? ' — new best!' : ''}</p>
              <button class="btn btn-primary" data-action="a-new">${icon('restart')} Play again</button>
            </div>`;
        }
        const w = s.deck[s.i];
        p.innerHTML = `
          <div class="q-meta"><span>${s.i + 1} / ${s.deck.length}</span><span>${s.streak > 1 ? `<span class="combo">${icon('flame')} ${s.streak} in a row</span>` : `<span style="color:var(--ok)">${s.score} correct</span>`}</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.deck.length * 100}%"></i></div>
          <div class="q-prompt">
            <div class="q-label">Which article?</div>
            <div class="art-word"><span class="art-slot" id="art-slot">&nbsp;</span>${esc(w.noun)}</div>
            <div class="muted">${esc(w.en)}</div>
          </div>
          <div class="art-btns">
            ${['der', 'die', 'das'].map((a, i) => `<button class="art-btn gender-${a}" data-action="a-ans" data-a="${a}">${a}<small>${['masc.', 'fem.', 'neut.'][i]}</small></button>`).join('')}
          </div>
          <div id="fb"></div>
          <div class="kbd-hint"><kbd>1</kbd> der · <kbd>2</kbd> die · <kbd>3</kbd> das · <kbd>Enter</kbd> next</div>`;
      },
      answerArticle(a) {
        const s = this.s, w = s.deck[s.i];
        if (s.answered || !w) return;
        s.answered = true;
        const ok = a === w.article;
        document.querySelectorAll('.art-btn').forEach(b => {
          b.disabled = true;
          if (b.dataset.a === w.article) b.classList.add('correct');
          else if (b.dataset.a === a) b.classList.add('wrong');
        });
        const slot = $('#art-slot');
        slot.textContent = w.article; slot.className = `art-slot art gender-${w.article}`; slot.style.borderBottomStyle = 'solid';
        slot.style.borderColor = 'var(--g)';
        if (ok) { s.score++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); }
        else { s.streak = 0; Store.setStatus(w.de, 'hard'); this.refreshStats(); }
        if (ok) { Speech.ok && Store.d.settings.autoSpeak && Speech.say(w.de); setTimeout(() => { if (this.s === s && s.deck[s.i] === w) this.nextArticle(); }, 650); }
        else $('#fb').innerHTML = `<div class="feedback bad"><span class="fb-text">It's <span class="art gender-${w.article}">${w.article}</span> ${esc(w.noun)}${w.plural ? `<small>Plural: ${esc(w.plural)}</small>` : ''}</span><button class="btn btn-sm btn-primary" data-action="a-next">Next ${icon('right')}</button></div>`;
      },
      nextArticle() { const s = this.s; s.i++; s.answered = false; this.renderArticles($('#panel')); },
      on_articles(a, el) {
        if (a === 'a-ans') return this.answerArticle(el.dataset.a);
        if (a === 'a-next') return this.nextArticle();
        if (a === 'a-new') { this.s = {}; return this.renderArticles($('#panel')); }
      },
      key_articles(e, typing) {
        if (typing || !this.s.deck) return;
        const m = { '1': 'der', '2': 'die', '3': 'das', 'q': 'der', 'w': 'die', 'e': 'das' }[e.key.toLowerCase()];
        if (m) this.answerArticle(m);
        else if (e.key === 'Enter' && this.s.answered) this.nextArticle();
      },

      /* ================= 5. Match ================= */
      renderMatch(p) {
        const s = this.s, list = this.pool();
        if (list.length < 3) return p.innerHTML = this.emptyState('This part needs at least 3 words for matching.');
        if (!s.pairs) {
          const pairs = pick(list, Math.min(6, list.length));
          Object.assign(s, { pairs, left: shuffle(pairs.map((w, i) => ({ i, text: w.de }))), right: shuffle(pairs.map((w, i) => ({ i, text: w.en }))), sel: null, hits: new Set(), errors: 0, t0: null, time: 0 });
        }
        if (s.hits.size === s.pairs.length) {
          const { better, prev } = this.recordBest('match', s.time, false);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">⚡</div>
              <h2>All matched in ${s.time.toFixed(1)}s</h2>
              <p>${s.errors} mistake${s.errors === 1 ? '' : 's'}${better && prev != null ? ' · new best time!' : prev != null ? ` · best ${prev.toFixed(1)}s` : ''}</p>
              <button class="btn btn-primary" data-action="m-new">${icon('restart')} Next round</button>
            </div>`;
        }
        const best = this.getBest('match');
        const tile = (t, side) => `<button class="tile ${s.hits.has(t.i) ? 'hit' : ''} ${s.sel && s.sel.side === side && s.sel.i === t.i ? 'sel' : ''}" data-action="m-tile" data-side="${side}" data-i="${t.i}">${esc(t.text)}</button>`;
        p.innerHTML = `
          <div class="q-meta"><span>${s.hits.size} / ${s.pairs.length} pairs</span><span id="m-time" style="font-variant-numeric:tabular-nums">${best != null ? `Best ${best.toFixed(1)}s · ` : ''}${s.t0 ? ((Date.now() - s.t0) / 1000).toFixed(0) + 's' : 'Tap to start'}</span></div>
          <div class="match-grid">
            <div class="match-col">${s.left.map(t => tile(t, 'L')).join('')}</div>
            <div class="match-col">${s.right.map(t => tile(t, 'R')).join('')}</div>
          </div>
          <div class="btn-row" style="margin-top:16px"><button class="btn btn-sm btn-ghost" data-action="m-new">${icon('shuffle')} New words</button></div>`;
        if (s.t0) this.timers.push(setInterval(() => { const el = $('#m-time'); if (el) el.textContent = `${best != null ? `Best ${best.toFixed(1)}s · ` : ''}${((Date.now() - s.t0) / 1000).toFixed(0)}s`; }, 500));
      },
      on_match(a, el) {
        const s = this.s;
        if (a === 'm-new') { this.s = {}; return this.renderMatch($('#panel')); }
        if (a !== 'm-tile' || s.lock) return;
        const side = el.dataset.side, i = +el.dataset.i;
        if (s.hits.has(i)) return;
        if (!s.t0) { s.t0 = Date.now(); }
        if (!s.sel || s.sel.side === side) { s.sel = { side, i }; if (side === 'L') Speech.ok && Store.d.settings.autoSpeak && Speech.say(s.pairs[i].de); return this.renderMatch($('#panel')); }
        if (s.sel.i === i) {
          s.hits.add(i); s.sel = null;
          if (s.hits.size === s.pairs.length) s.time = (Date.now() - s.t0) / 1000;
          return this.renderMatch($('#panel'));
        }
        s.errors++;
        const other = document.querySelector(`.tile[data-side="${s.sel.side}"][data-i="${s.sel.i}"]`);
        el.classList.add('miss'); other && other.classList.replace('sel', 'miss');
        s.lock = true; s.sel = null;
        setTimeout(() => { s.lock = false; if (this.s === s) this.renderMatch($('#panel')); }, 450);
      },

      /* ================= 6. Sprint ================= */
      SPRINT_TIME: 60,
      renderSprint(p) {
        const s = this.s, list = this.pool();
        if (list.length < 4) return p.innerHTML = this.emptyState('This part needs at least 4 words for Sprint.');
        if (!s.phase) s.phase = 'intro';
        const best = this.getBest('sprint');
        if (s.phase === 'intro') {
          return p.innerHTML = `
            <div class="hero">
              <div class="hero-icon">${icon('zap')}</div>
              <h2>60-second sprint</h2>
              <p>Answer as many as you can. Right answers build a combo, wrong ones cost 3 seconds.</p>
              ${best != null ? `<p class="small" style="margin-top:-10px">${icon('trophy')} Best in ${this.part ? 'this part' : 'this chapter'}: <b style="color:var(--accent)">${best}</b></p>` : ''}
              <button class="btn btn-primary btn-lg" data-action="s-start" style="padding:0 32px">Start ${icon('zap')}</button>
            </div>`;
        }
        if (s.phase === 'over') {
          const { better, prev } = this.recordBest('sprint', s.score);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${better && prev != null ? '🏆' : '⏱️'}</div>
              <h2>${s.score} correct</h2>
              <p>${better && prev != null ? `New record! (was ${prev})` : prev != null ? `Best: ${Math.max(prev, s.score)}` : 'First run recorded.'} · top combo ${s.maxCombo}</p>
              <button class="btn btn-primary" data-action="s-start">${icon('restart')} Go again</button>
            </div>`;
        }
        const q = s.q;
        p.innerHTML = `
          <div class="timer-bar ${s.left <= 10 ? 'low' : ''}"><i id="s-bar" style="width:${s.left / this.SPRINT_TIME * 100}%"></i></div>
          <div class="q-meta"><span id="s-left" style="font-variant-numeric:tabular-nums">${s.left}s</span><span>${s.combo > 1 ? `<span class="combo">×${s.combo} combo</span> · ` : ''}Score <b style="color:var(--text)">${s.score}</b></span></div>
          <div class="q-prompt"><div class="q-label">${q.toEn ? 'English?' : 'German?'}</div><div class="q-word ${gClass(q.w)}">${q.toEn ? this.deHtml(q.w) : esc(q.w.en)}</div></div>
          <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-action="s-ans" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
          <div class="kbd-hint"><kbd>1</kbd>–<kbd>4</kbd> answer</div>`;
        this.timers.push(setInterval(() => this.sprintTick(), 1000));
      },
      sprintQ() {
        const list = this.pool(), w = list[Math.floor(Math.random() * list.length)];
        const toEn = Math.random() < 0.5, f = toEn ? 'en' : 'de';
        return { w, toEn, answer: w[f], opts: shuffle([w[f], ...this.distractors(w, 3, f)]) };
      },
      sprintTick() {
        const s = this.s;
        if (s.phase !== 'run') return;
        s.left--;
        if (s.left <= 0) { s.phase = 'over'; this.touchAndRender(); return; }
        const bar = $('#s-bar'), lab = $('#s-left');
        if (bar) { bar.style.width = `${s.left / this.SPRINT_TIME * 100}%`; bar.parentElement.classList.toggle('low', s.left <= 10); }
        if (lab) lab.textContent = `${s.left}s`;
      },
      touchAndRender() { Store.touchStreak(); Store.save(); this.renderStreak(); this.renderSprint($('#panel')); },
      answerSprint(i) {
        const s = this.s;
        if (s.phase !== 'run' || s.lock) return;
        const ok = s.q.opts[i] === s.q.answer;
        const btn = document.querySelectorAll('.opt')[i];
        if (ok) { s.score++; s.combo++; s.maxCombo = Math.max(s.maxCombo, s.combo); btn.classList.add('correct'); }
        else {
          s.combo = 0; s.left = Math.max(0, s.left - 3); btn.classList.add('wrong');
          document.querySelectorAll('.opt').forEach((b, j) => { if (s.q.opts[j] === s.q.answer) b.classList.add('correct'); });
        }
        s.lock = true;
        setTimeout(() => {
          if (this.s !== s) return;
          s.lock = false;
          if (s.left <= 0) { s.phase = 'over'; return this.touchAndRender(); }
          s.q = this.sprintQ(); this.clearTimers(); this.renderSprint($('#panel'));
        }, ok ? 220 : 700);
      },
      on_sprint(a, el) {
        if (a === 's-start') { this.s = { phase: 'run', left: this.SPRINT_TIME, score: 0, combo: 0, maxCombo: 0, q: this.sprintQ() }; return this.renderSprint($('#panel')); }
        if (a === 's-ans') return this.answerSprint(+el.dataset.i);
      },
      key_sprint(e, typing) {
        if (typing) return;
        if (/^[1-4]$/.test(e.key)) this.answerSprint(+e.key - 1);
        else if (e.key === 'Enter' && this.s.phase !== 'run') this.on_sprint('s-start');
      },

      /* ================= 7. Sentences ================= */
      renderSentences(p) {
        const s = this.s;
        if (!s.qs) {
          const phrases = this.pool().filter(w => !w.article && w.de.split(/\s+/).length >= 3 && !w.de.includes('/') && !w.de.includes('...'));
          Object.assign(s, { qs: shuffle(phrases).slice(0, 8), i: 0, score: 0, placed: [], checked: null });
        }
        if (!s.qs.length) return p.innerHTML = `<div class="hero"><div class="hero-icon">${icon('puzzle')}</div><h2>No sentences here</h2><p>${this.part ? 'This part only has single words. Try another part or “All”.' : 'This chapter only has single words.'} Try Flashcards or the Quiz — or pick a chapter with phrases like chapter 1.</p></div>`;
        if (s.i >= s.qs.length) {
          return p.innerHTML = `
            <div class="summary"><div class="big">🧩</div><h2>${s.score} / ${s.qs.length} built correctly</h2><p>Word order is the hardest part of German — nice work.</p>
            <button class="btn btn-primary" data-action="x-new">${icon('restart')} Play again</button></div>`;
        }
        const q = s.qs[s.i];
        const words = q.de.replace(/[.?!]+$/, '').split(/\s+/);
        if (!s.order || s.order.q !== q) s.order = { q, idx: shuffle(words.map((_, i) => i)) };
        const placedSet = new Set(s.placed);
        const cls = s.checked === true ? 'ok' : s.checked === false ? 'bad' : '';
        p.innerHTML = `
          <div class="q-meta"><span>Sentence ${s.i + 1} / ${s.qs.length}</span><span style="color:var(--ok)">${s.score} correct</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.qs.length * 100}%"></i></div>
          <div class="q-prompt" style="padding-bottom:16px"><div class="q-label">Build this in German</div><div class="q-word">“${esc(q.en)}”</div></div>
          <div class="build ${s.placed.length ? 'filled' : ''} ${cls}">
            ${s.placed.length ? s.placed.map((wi, k) => `<button class="wchip placed" data-action="x-remove" data-k="${k}">${esc(words[wi])}</button>`).join('') : '<span class="muted small">Tap the words below in the right order</span>'}
          </div>
          <div class="pool">${s.order.idx.filter(i => !placedSet.has(i)).map(i => `<button class="wchip" data-action="x-place" data-i="${i}">${esc(words[i])}</button>`).join('')}</div>
          <div class="btn-row">
            ${s.checked === null ? `
              <button class="btn" data-action="x-clear">Clear</button>
              <button class="btn btn-primary" data-action="x-check" ${s.placed.length !== words.length ? 'disabled style="opacity:.5"' : ''}>Check</button>` :
              `<button class="btn btn-primary" data-action="x-next">Next ${icon('right')}</button>`}
          </div>
          <div id="fb">${s.checked === false ? `<div class="feedback bad"><span class="fb-text">Correct order<small>${esc(q.de)}</small></span>${this.speakBtn(q.de)}</div>` : s.checked ? `<div class="feedback ok"><span class="fb-text">Richtig!<small>${esc(q.de)}</small></span>${this.speakBtn(q.de)}</div>` : ''}</div>`;
        s.words = words;
      },
      on_sentences(a, el) {
        const s = this.s, P = () => this.renderSentences($('#panel'));
        if (a === 'x-new') { this.s = {}; return P(); }
        if (s.checked !== null && a !== 'x-next') return;
        if (a === 'x-place') { s.placed.push(+el.dataset.i); return P(); }
        if (a === 'x-remove') { s.placed.splice(+el.dataset.k, 1); return P(); }
        if (a === 'x-clear') { s.placed = []; return P(); }
        if (a === 'x-check') {
          const built = s.placed.map(i => s.words[i]).join(' ').toLowerCase();
          s.checked = built === s.words.join(' ').toLowerCase();
          if (s.checked) s.score++;
          Store.touchStreak(); Store.save(); this.renderStreak();
          return P();
        }
        if (a === 'x-next') { s.i++; s.placed = []; s.checked = null; s.order = null; return P(); }

      /* ================= 8. Word list ================= */
      renderWords(p) {
        const s = this.s;
        if (s.q == null) Object.assign(s, { q: '', f: 'all', all: false });
        p.innerHTML = `
          <div class="panel-head" style="margin-bottom:0">
            <label class="search">${icon('search')}<input id="w-q" type="search" placeholder="Search German or English…" value="${esc(s.q)}" autocomplete="off"></label>
          </div>
          <div class="filters">
            ${[['all', 'All'], ['new', 'New'], ['hard', 'Still learning'], ['learned', 'Mastered']].map(([k, l]) => `<button class="fchip ${s.f === k ? 'on' : ''}" data-action="w-f" data-f="${k}">${l}</button>`).join('')}
            <button class="fchip scope ${s.all ? 'on' : ''}" data-action="w-all">${icon('globe')} All chapters</button>
          </div>
          <div class="wlist" id="w-list"></div>`;
        const inp = $('#w-q');
        inp.addEventListener('input', () => { s.q = inp.value; this.renderWordRows(); });
        this.renderWordRows();

      renderWordRows() {
        const s = this.s;
        let rows = [];
        if (s.all) { for (const { id: lv } of LEVELS) for (let ch = 1; ch <= 24; ch++) for (const w of this.words(lv, ch)) rows.push({ w, lv, ch }); }
        else rows = this.pool().map(w => ({ w }));
        const q = this.fold(s.q || '');
        if (q) rows = rows.filter(({ w }) => this.fold(w.de).includes(q) || w.en.toLowerCase().includes(s.q.toLowerCase().trim()));
        if (s.f !== 'all') rows = rows.filter(({ w }) => Store.status(w.de) === s.f);
        const LABEL = { new: 'New', hard: 'Learning', learned: 'Mastered' };
        const shown = rows.slice(0, 300);
        $('#w-list').innerHTML = shown.length ? shown.map(({ w, lv, ch }) => {
          const st = Store.status(w.de), extra = this.wordExtra(w);
          return `<div class="wrow ${gClass(w)}">
            <span class="bar"></span>
            <div>
              <div class="de">${this.deHtml(w)}</div>
              <div class="en">${esc(w.en)}</div>
              ${extra || lv ? `<div class="extra">${extra}${extra && lv ? ' · ' : ''}${lv ? `${lv} · Ch ${ch}` : ''}</div>` : ''}
            </div>
            <div class="acts">${this.speakBtn(w.de)}<button class="pill ${st}" data-action="w-cycle" data-key="${esc(w.de)}" title="Tap to change">${LABEL[st]}</button></div>
          </div>`;
        }).join('') + (rows.length > 300 ? `<div class="empty small">Showing 300 of ${rows.length} — refine your search.</div>` : '')
          : this.emptyState(s.q ? 'No words match your search.' : 'Nothing here yet.');
      },
      on_words(a, el) {
        const s = this.s;
        if (a === 'w-f') { s.f = el.dataset.f; document.querySelectorAll('.fchip[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === s.f)); return this.renderWordRows(); }
        if (a === 'w-all') { s.all = !s.all; el.classList.toggle('on', s.all); return this.renderWordRows(); }
        if (a === 'w-cycle') {
          const next = { new: 'hard', hard: 'learned', learned: 'new' }[Store.status(el.dataset.key)];
          Store.setStatus(el.dataset.key, next);
          this.refreshStats(); return this.renderWordRows();
        }
      },
      key_words(e, typing) {
        if (!typing && e.key === '/') { e.preventDefault(); $('#w-q')?.focus(); }
      },
    };

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        const firstInstall = !navigator.serviceWorker.controller;
        // iPhone keeps home-screen apps suspended instead of reloading them,
        // so look for a newer version every time the app comes back on screen.
        const lookForUpdate = async () => {
          const v = await app.remoteVersion();
          if (v && v > APP_VERSION) {
            navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
            app.showUpdateBar();
          }
        };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lookForUpdate(); });
        setTimeout(lookForUpdate, 3000);
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
          const done = () => { if (firstInstall) app.toast('Ready to use offline'); };
          if (reg.active && !reg.installing) return;
          const w = reg.installing || reg.waiting;
          if (w) w.addEventListener('statechange', () => { if (w.state === 'activated') done(); });
        }).catch(() => {});
        // Ask the browser not to clear saved progress
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      });
