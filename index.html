<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glitch Deutsch">
  <meta name="theme-color" content="#0c0f16">
  <title>Glitch Deutsch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #0c0f16;
      --bg-2: #121722;
      --surface: #171d2a;
      --surface-2: #1f2737;
      --surface-3: #2a3346;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.16);
      --text: #eef1f7;
      --text-2: #a4adbf;
      --text-3: #6d778b;

      --accent: #ffc83d;
      --accent-ink: #1a1405;
      --accent-soft: rgba(255,200,61,0.14);

      --ok: #34d399;
      --ok-soft: rgba(52,211,153,0.14);
      --bad: #f87171;
      --bad-soft: rgba(248,113,113,0.14);

      --der: #60a5fa;  --der-soft: rgba(96,165,250,0.14);
      --die: #f472b6;  --die-soft: rgba(244,114,182,0.14);
      --das: #4ade80;  --das-soft: rgba(74,222,128,0.14);

      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --ease: cubic-bezier(.2,.8,.2,1);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f4f5f8;
      --bg-2: #eceef3;
      --surface: #ffffff;
      --surface-2: #f1f3f7;
      --surface-3: #e3e7ee;
      --line: rgba(15,23,42,0.08);
      --line-strong: rgba(15,23,42,0.16);
      --text: #111827;
      --text-2: #4b5567;
      --text-3: #8a93a5;
      --accent: #e0a100;
      --accent-ink: #1a1405;
      --accent-soft: rgba(224,161,0,0.14);
      --ok: #059669;  --ok-soft: rgba(5,150,105,0.12);
      --bad: #dc2626; --bad-soft: rgba(220,38,38,0.1);
      --der: #2563eb; --der-soft: rgba(37,99,235,0.1);
      --die: #db2777; --die-soft: rgba(219,39,119,0.1);
      --das: #16a34a; --das-soft: rgba(22,163,74,0.1);
      --shadow: 0 10px 30px rgba(15,23,42,0.08);
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
    svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px);
    }

    /* ---------- Header ---------- */
    .top { display: flex; align-items: center; gap: 10px; padding: 6px 0 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .mark { width: 36px; height: 36px; flex: none; border-radius: 10px; box-shadow: 0 4px 14px rgba(255,200,61,.25); }
    .brand .wm { font-size: 1.22rem; font-weight: 850; letter-spacing: -0.03em; line-height: 1; }
    .brand .wm span { font-weight: 550; color: var(--text-2); }
    .top .spacer { flex: 1; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      font-weight: 700; font-size: .85rem; color: var(--text-2);
    }
    .chip.streak.on { color: var(--accent); }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
      transition: background .15s, color .15s, transform .1s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-2); }
    .icon-btn:active { transform: scale(.94); }

    /* ---------- Chapter card ---------- */
    .chapter-card {
      background: linear-gradient(160deg, var(--surface) 0%, var(--bg-2) 100%);
      border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px; margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .ch-row { display: flex; align-items: center; gap: 10px; }
    .ch-pick { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 4px 6px; margin: -4px -6px; border-radius: 12px; }
    .ch-pick:hover { background: var(--surface-2); }
    .ch-kicker { font-size: .75rem; font-weight: 750; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .ch-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
    .ch-title svg { color: var(--text-3); flex: none; }
    .ch-arrows { display: flex; gap: 6px; }
    .ch-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .lvl { display: inline-flex; align-items: center; gap: 8px; }
    .lvl-label { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .lvl .seg button { padding: 7px 16px; font-size: .88rem; }
    .lvl .seg button.on { background: var(--accent); color: var(--accent-ink); }
    .ch-switch {
      width: 100%; margin-top: 12px; display: flex; align-items: center; gap: 12px; text-align: left;
      padding: 12px 14px; border-radius: var(--r-md); background: var(--accent-soft);
      border: 1.5px dashed var(--accent); color: var(--text); transition: background .15s, transform .1s;
    }
    .ch-switch:hover { background: rgba(255,200,61,0.22); }
    .ch-switch:active { transform: scale(.985); }
    .ch-switch .sw-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
    .ch-switch .sw-t { flex: 1; min-width: 0; }
    .ch-switch .sw-t b { display: block; font-size: .95rem; }
    .ch-switch .sw-t span { display: block; font-size: .78rem; color: var(--text-2); }
    .ch-switch .sw-go { color: var(--accent); font-weight: 800; font-size: .85rem; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    /* Course header: level tabs, chapter carousel, parts path */
    .course {
      background: linear-gradient(170deg, var(--surface) 0%, var(--bg-2) 100%);
      border: 1px solid var(--line); border-radius: var(--r-xl); margin-bottom: 14px;
      box-shadow: var(--shadow); overflow: hidden; padding-top: 6px;
    }
    .lv-tabs { display: flex; align-items: flex-end; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .lv-tab { position: relative; padding: 10px 0 11px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; color: var(--text-3); text-align: left; }
    .lv-tab b { font-size: 1.15rem; font-weight: 850; letter-spacing: -0.01em; line-height: 1.1; }
    .lv-tab small { font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .lv-tab b em { font-style: normal; font-size: .7rem; font-weight: 750; margin-left: 6px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--text-3); vertical-align: 2px; }
    .lv-tab.on b em { background: var(--ok-soft); color: var(--ok); }
    .lv-tab.on { color: var(--text); }
    .lv-tab.on small { color: var(--text-2); }
    .lv-tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
    .lv-all { white-space: nowrap; flex: none; margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; background: var(--surface-2); color: var(--text); font-size: .8rem; font-weight: 750; }
    .lv-all:hover { background: var(--surface-3); }
    @media (max-width: 430px) {
      .lv-tabs { gap: 14px; padding: 0 14px; }
      .lv-all { width: 36px; padding: 0; justify-content: center; }
      .lv-all-t { display: none; }
      .lv-tab b em { margin-left: 4px; padding: 1px 5px; }
    }
    .strip-wrap { position: relative; }
    .strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 18px 16px; scroll-snap-type: x mandatory; scroll-padding: 0 18px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .strip::-webkit-scrollbar { display: none; }
    .cc {
      flex: 0 0 min(62%, 230px); scroll-snap-align: center; text-align: left; min-height: 108px;
      display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 18px;
      background: var(--surface-2); border: 1.5px solid transparent; transition: background .15s, border-color .15s, transform .15s;
    }
    .cc:hover { background: var(--surface-3); }
    .cc:active { transform: scale(.98); }
    .cc .n { display: flex; justify-content: space-between; align-items: center; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
    .cc .n svg { width: 1.2em; height: 1.2em; color: var(--ok); }
    .cc .t { flex: 1; font-weight: 800; font-size: .98rem; line-height: 1.25; color: var(--text); }
    .cc .bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
    .cc .bar i { display: block; height: 100%; background: var(--ok); }
    .cc.on { background: linear-gradient(160deg, var(--accent-soft), var(--surface-2) 80%); border-color: var(--accent); }
    .cc.on .n { color: var(--accent); }
    .cc.on .t { font-size: 1.05rem; }
    .strip-hint { position: absolute; right: 0; top: 14px; bottom: 16px; width: 28px; pointer-events: none; background: linear-gradient(90deg, transparent, var(--bg-2)); }
    .cur { padding: 2px 18px 18px; border-top: 1px solid var(--line); }
    .cur-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 0 12px; }
    .cur-head b { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
    .cur-head span { font-size: .75rem; color: var(--text-3); font-weight: 650; }
    .steps { display: flex; align-items: flex-start; }
    .step { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 50px; }
    .step .ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-3) 0); transition: transform .15s; }
    .step:active .ring { transform: scale(.94); }
    .step .ring > span { width: 37px; height: 37px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-weight: 850; font-size: 1rem; color: var(--text-2); }
    .step .ring svg { width: 18px; height: 18px; }
    .step small { font-size: .68rem; font-weight: 750; color: var(--text-3); white-space: nowrap; }
    .step.full .ring > span { background: var(--ok-soft); color: var(--ok); }
    .step.on .ring > span { background: var(--accent); color: var(--accent-ink); }
    .step.on small { color: var(--accent); }
    .steps .ln { flex: 1; height: 2px; min-width: 6px; margin-top: 22px; background: var(--surface-3); border-radius: 2px; }
    .steps .ln.full { background: var(--ok); }
    .steps .gap { flex: 1.4; min-width: 10px; margin-top: 22px; border-top: 2px dotted var(--surface-3); }
    .cur-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .cur-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--text-2); }
    .cur-stats b { color: var(--text); font-variant-numeric: tabular-nums; }
    .parts-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 16px; }
    .parts-head b { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .parts-head span { font-size: .75rem; color: var(--text-3); }
    .parts { display: grid; gap: 6px; margin-top: 8px; }
    .part {
      padding: 8px 4px 8px; border-radius: 12px; background: var(--surface-2); border: 1.5px solid transparent;
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
      transition: background .15s, border-color .15s;
    }
    .part:hover { background: var(--surface-3); }
    .part b { font-size: .85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .part b svg { width: .95em; height: .95em; color: var(--ok); }
    .part span { font-size: .68rem; color: var(--text-3); font-weight: 650; white-space: nowrap; }
    .part .pbar { width: 70%; height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 3px; }
    .part .pbar i { display: block; height: 100%; background: var(--ok); }
    .part.on { border-color: var(--accent); background: var(--accent-soft); }
    .part.on b { color: var(--accent); }
    .progress { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; display: flex; margin: 16px 0 10px; }
    .progress i { display: block; height: 100%; transition: width .4s var(--ease); }
    .progress .p-ok { background: var(--ok); }
    .progress .p-bad { background: var(--bad); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--text-2); align-items: center; }
    .legend b { color: var(--text); font-variant-numeric: tabular-nums; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
    .legend .spacer { flex: 1; }
    .done-btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700;
      padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--text-2);
    }
    .done-btn.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

    /* ---------- Mode tabs ---------- */
    .modes {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 14px; margin: 0 -16px;
      scrollbar-width: none; scroll-snap-type: x proximity;
    }
    .modes::-webkit-scrollbar { display: none; }
    .mode {
      flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      color: var(--text-2); font-weight: 700; font-size: .88rem; scroll-snap-align: start;
      transition: background .15s, color .15s, border-color .15s;
    }
    .mode:hover { color: var(--text); }
    .mode.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .mode .badge { background: var(--bad); color: #fff; font-size: .7rem; min-width: 18px; height: 18px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
    .mode.active .badge { background: var(--accent-ink); color: var(--accent); }

    /* ---------- Panel ---------- */
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl);
      padding: 20px; min-height: 420px; box-shadow: var(--shadow);
      animation: rise .25s var(--ease);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .muted { color: var(--text-2); }
    .small { font-size: .82rem; }
    .kbd-hint { font-size: .75rem; color: var(--text-3); text-align: center; margin-top: 14px; }
    .kbd-hint kbd { font-family: inherit; font-size: .7rem; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--text-2); }
    @media (hover: none) { .kbd-hint { display: none; } }

    .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
    .seg button { padding: 6px 12px; border-radius: 9px; font-size: .8rem; font-weight: 700; color: var(--text-2); }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    :root[data-theme="light"] .seg button.on { box-shadow: 0 1px 3px rgba(15,23,42,.12); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 18px; border-radius: var(--r-md); font-weight: 750; font-size: .95rem;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
      transition: transform .1s, background .15s, filter .15s; user-select: none;
    }
    .btn:hover { background: var(--surface-3); }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .btn-primary:hover { background: var(--accent); filter: brightness(1.07); }
    .btn-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
    .btn-ok:hover { background: var(--ok); color: #04150e; }
    .btn-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
    .btn-bad:hover { background: var(--bad); color: #1a0505; }
    .btn-ghost { background: transparent; }
    .btn-sm { height: 34px; padding: 0 12px; font-size: .82rem; border-radius: 10px; }
    .btn-lg { height: 56px; font-size: 1.02rem; border-radius: var(--r-lg); }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .gender-der { --g: var(--der); --g-soft: var(--der-soft); }
    .gender-die { --g: var(--die); --g-soft: var(--die-soft); }
    .gender-das { --g: var(--das); --g-soft: var(--das-soft); }
    .art { color: var(--g, var(--text-2)); font-weight: 800; }

    /* ---------- Flashcards ---------- */
    .deck-bar { height: 4px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
    .deck-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s var(--ease); }
    .card-stage { perspective: 1400px; margin-bottom: 16px; touch-action: pan-y; }
    .fcard {
      position: relative; min-height: 300px; -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
      transition: transform .55s var(--ease); cursor: pointer; user-select: none;
    }
    .fcard.flipped { transform: rotateY(180deg); }
    .fcard.dragging { transition: none; }
    .fface {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column;
      background: var(--surface-2); border: 1px solid var(--line-strong);
    }
    .fface.back { transform: rotateY(180deg); }
    .fface.g { background: linear-gradient(160deg, var(--g-soft), var(--surface-2) 70%); border-color: var(--g); border-color: color-mix(in srgb, var(--g) 45%, transparent); }
    .fface-top { display: flex; justify-content: space-between; align-items: center; font-size: .75rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .fface-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 10px 0; }
    .fword { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 850; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
    .fsub { color: var(--text-2); font-size: .95rem; }
    .fsub b { color: var(--text); font-weight: 700; }
    .fhint { text-align: center; font-size: .78rem; color: var(--text-3); }
    .gtag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--g-soft); color: var(--g); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .speak { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2); background: var(--surface-3); }
    .speak:hover { color: var(--text); }
    .swipe-tag { position: absolute; top: 18px; padding: 6px 12px; border-radius: 10px; font-weight: 850; font-size: .85rem; letter-spacing: .06em; opacity: 0; pointer-events: none; z-index: 2; }
    .swipe-tag.l { left: 18px; background: var(--bad); color: #fff; transform: rotate(-8deg); }
    .swipe-tag.r { right: 18px; background: var(--ok); color: #04150e; transform: rotate(8deg); }
    .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .deck-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .deck-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .deck-mid .btn { height: 28px; padding: 0 10px; font-size: .78rem; color: var(--text-2); }
    .summary { text-align: center; padding: 30px 10px; }
    .summary .big { font-size: 3.2rem; line-height: 1; margin-bottom: 10px; }
    .summary h2 { font-size: 1.5rem; letter-spacing: -0.01em; margin-bottom: 6px; }
    .summary p { color: var(--text-2); margin-bottom: 22px; }
    .stat-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .stat { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 18px; min-width: 96px; }

    .stat span { font-size: .75rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }

    /* ---------- Quiz / options ---------- */
    .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; color: var(--text-2); font-weight: 700; margin-bottom: 10px; }
    .q-prompt { text-align: center; padding: 26px 8px 24px; }
    .q-label { font-size: .75rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
    .q-word { font-size: clamp(1.4rem, 5.5vw, 2rem); font-weight: 850; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 10px; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
    .opt {
      text-align: left; padding: 14px 16px; min-height: 56px; border-radius: var(--r-md);
      background: var(--surface-2); border: 1.5px solid transparent; font-weight: 650; display: flex; gap: 12px; align-items: center;

    .opt:hover:not(:disabled) { background: var(--surface-3); }
    .opt:active:not(:disabled) { transform: scale(.98); }
    .opt .n { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); color: var(--text-3); font-size: .75rem; font-weight: 800; display: grid; place-items: center; flex: none; }
    .opt.correct { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
    .opt.correct .n { background: var(--ok); color: #04150e; }
    .opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); animation: shake .35s; }

    .feedback.bad { background: var(--bad-soft); color: var(--bad); }
    .feedback.meh { background: var(--accent-soft); color: var(--accent); }
    .feedback .fb-text { display: flex; flex-direction: column; gap: 2px; }
    .feedback .fb-text small { color: var(--text-2); font-weight: 600; }

    /* ---------- Type mode ---------- */
    .type-box { display: flex; gap: 8px; }
    .type-input {
      flex: 1; min-width: 0; height: 56px; padding: 0 16px; border-radius: var(--r-md);

    .type-input:focus { border-color: var(--accent); }
    .type-input.ok { border-color: var(--ok); color: var(--ok); }
    .type-input.bad { border-color: var(--bad); color: var(--bad); }
    .umlauts { display: flex; gap: 6px; margin-top: 10px; justify-content: center; }
    .umlauts button { width: 44px; height: 40px; border-radius: 10px; background: var(--surface-2); font-weight: 750; font-size: 1.05rem; }
    .umlauts button:hover { background: var(--surface-3); }

    /* ---------- Articles ---------- */
    .art-word { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 850; letter-spacing: -0.02em; margin: 6px 0 4px; overflow-wrap: anywhere; }
    .art-slot { display: inline-block; min-width: 2.6em; border-bottom: 3px dashed var(--line-strong); color: var(--text-3); margin-right: .25em; }
    .art-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .art-btn {
      height: 72px; border-radius: var(--r-lg); font-size: 1.35rem; font-weight: 850;
      background: var(--g-soft); color: var(--g); border: 1.5px solid transparent; transition: transform .1s, border-color .15s, background .15s;
    }
    .art-btn:hover:not(:disabled) { border-color: var(--g); }
    .art-btn:active:not(:disabled) { transform: scale(.96); }
    .art-btn.correct { background: var(--g); color: var(--bg); }
    .art-btn.wrong { border-color: var(--bad); animation: shake .35s; opacity: .7; }
    .art-btn:disabled { cursor: default; }
    .art-btn small { display: block; font-size: .65rem; font-weight: 700; opacity: .7; letter-spacing: .06em; text-transform: uppercase; }

    /* ---------- Match ---------- */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-col { display: flex; flex-direction: column; gap: 10px; }

    .tile:hover { background: var(--surface-3); }
    .tile.sel { border-color: var(--accent); background: var(--accent-soft); }

    .tile.hit { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); opacity: .35; pointer-events: none; transform: scale(.97); }

    .build.bad { border-color: var(--bad); }

    .wchip { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-strong); font-weight: 700; transition: transform .1s, background .15s; }

    .wrow { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }

    .wrow .extra { color: var(--text-3); font-size: .78rem; margin-top: 1px; }
    .wrow .acts { display: flex; gap: 6px; align-items: center; }
    .pill { height: 28px; padding: 0 10px; border-radius: 99px; font-size: .72rem; font-weight: 800; letter-spacing: .02em; white-space: nowrap; background: var(--surface-2); color: var(--text-3); }
    .pill.learned { background: var(--ok-soft); color: var(--ok); }
    .pill.hard { background: var(--bad-soft); color: var(--bad); }
    .empty { text-align: center; color: var(--text-2); padding: 50px 10px; }

    /* ---------- Sheets ---------- */
    .scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet {
      background: var(--bg-2); width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column;
      border-radius: var(--r-xl) var(--r-xl) 0 0; border: 1px solid var(--line); border-bottom: 0;
      padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); animation: up .3s var(--ease);

    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet-grab { width: 40px; height: 5px; background: var(--line-strong); border-radius: 5px; margin: 0 auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

    .ch-item .mini { height: 4px; background: var(--surface-3); border-radius: 4px; margin-top: 6px; overflow: hidden; }

    .ch-item .pct { font-size: .75rem; color: var(--text-3); font-weight: 700; font-variant-numeric: tabular-nums; }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .set-row:last-child { border-bottom: 0; }

    .toggle { width: 50px; height: 30px; border-radius: 30px; background: var(--surface-3); position: relative; transition: background .2s; flex: none; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .toggle.on { background: var(--ok); }

    .icon-btn { position: relative; }

    .inst-intro { color: var(--text-2); font-size: .9rem; margin: -4px 0 14px; }
    .inst-tabs { display: flex; margin-bottom: 14px; }

    .inst-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .inst-list .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 850; font-size: .85rem; }
    .inst-list b { font-weight: 800; }

    .glyph svg { width: 16px; height: 16px; }
    .inst-note { margin-top: 12px; font-size: .82rem; color: var(--text-2); padding: 10px 12px; border-radius: var(--r-md); background: var(--accent-soft); }
    .inst-done { text-align: center; padding: 20px 10px 6px; }

    .update-bar {
      position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); z-index: 70;
      max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
      padding: 10px 10px 10px 16px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
      font-weight: 750; font-size: .9rem; box-shadow: var(--shadow); animation: up .3s var(--ease);
    }

    .update-bar button { height: 36px; padding: 0 16px; border-radius: 11px; background: var(--accent-ink); color: var(--accent); font-weight: 800; }
    .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: .88rem; z-index: 60; animation: up .25s var(--ease); box-shadow: var(--shadow); }

      *, *::before, *::after { animation: none !important; transition: none !important; }
