        this.openSheet(`
          <div class="sheet-head"><h3>Settings</h3><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
          <div class="sheet-body">
            <div class="set-row"><div class="lbl"><b>Add to Home Screen</b><span>${this.isStandalone() ? 'Installed ✓ — open the guide to help someone else' : 'Use it like an app, even offline'}</span></div>
              <button class="btn btn-sm ${this.isStandalone() ? '' : 'btn-primary'}" data-action="install">${this.isStandalone() ? 'Open guide' : 'Show me how'}</button></div>
            <div class="set-row"><div class="lbl"><b>Appearance</b><span>${document.documentElement.dataset.theme === 'light' ? 'Light' : 'Dark'} mode</span></div>
              <button class="btn btn-sm" data-action="theme">${icon(document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun')} Switch to ${document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'}</button></div>
            <div class="set-row"><div class="lbl"><b>About this app</b><span>Words by Dr. Omar Alduais · A1 ch. 1–15 English by AI · the rest from GJU eLearning</span></div>
              <button class="btn btn-sm" data-action="notice">Open</button></div>
            <div class="set-row"><div class="lbl"><b>German voice</b><span id="voice-status">${Speech.voice ? 'Using ' + esc(Speech.voice.name) : Speech.blind ? "Using the phone's German voice" : Speech.ready ? 'No German voice on this device' : 'Checking…'}</span>
              ${Speech.voices.length > 1 ? `<select id="voice-select" class="voice-select" aria-label="German voice">${Speech.voices.map(v => `<option value="${esc(v.voiceURI)}" ${Speech.voice && v.voiceURI === Speech.voice.voiceURI ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>` : ''}</div>
              ${Speech.canSpeak ? '<button class="btn btn-sm" data-action="voice-test">' + icon('speaker') + ' Test</button>' : '<button class="btn btn-sm btn-primary" data-action="voice-help">How to add</button>'}</div>
            <div class="set-row"><div class="lbl"><b>Voice check</b><span style="font-size:.75rem">${Speech.ok ? speechSynthesis.getVoices().length + ' voices · ' + Speech.voices.length + ' German' : 'no speech support'} · ${this.isStandalone() ? 'Home Screen app' : 'browser'} · v${APP_VERSION}</span></div></div>
            <div class="set-row"><div class="lbl"><b>Speak German automatically</b><span>Read each German word aloud on flashcards${Speech.canSpeak ? '' : ' (needs a German voice)'}</span></div>
              <button class="toggle ${st.autoSpeak ? 'on' : ''}" data-action="set-toggle" data-key="autoSpeak" aria-label="Auto speak"></button></div>
            <div class="set-row"><div class="lbl"><b>App version ${APP_VERSION}</b><span id="update-status">Updates install automatically when you're online</span></div>
              <button class="btn btn-sm" data-action="check-update">Check for updates</button></div>
            <div class="set-row"><div class="lbl"><b>Works offline</b><span id="offline-status">Checking…</span></div><span id="offline-dot" class="dot" style="width:12px;height:12px;margin:0;background:var(--surface-3)"></span></div>
            <div class="set-row"><div class="lbl"><b>Your progress</b><span>${allLearned} words mastered · ${allHard} still learning · ${Store.liveStreak()}-day streak</span></div></div>
            <div class="set-row"><div class="lbl"><b>Back up progress</b><span>Save a file, or restore from one on another device</span></div>
              <div class="btn-row"><button class="btn btn-sm" data-action="export">Export</button><button class="btn btn-sm" data-action="import">Import</button></div></div>
            <div class="set-row"><div class="lbl"><b>Reset everything</b><span>Clears mastered words, practice list and streak</span></div>
              <button class="btn btn-sm btn-bad" data-action="reset-all">Reset</button></div>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>`);
        $('#import-file').addEventListener('change', e => this.importProgress(e.target.files[0]));
        const vs = $('#voice-select');
        if (vs) vs.addEventListener('change', () => {
          Store.d.settings.voice = vs.value; Store.save();
          Speech.voice = Speech.pick(); Speech.say('Hallo!');
          $('#voice-status').textContent = 'Using ' + Speech.voice.name;
        });
        this.checkOffline();
      },

      // Reads the version number of the copy on the website (null when offline).
      async remoteVersion() {
        try {
          const t = await (await fetch('./index.html?v=' + Date.now(), { cache: 'no-store' })).text();
          const m = t.match(/const APP_VERSION = (\d+);/);
          return m ? +m[1] : null;
        } catch (e) { return null; }
      },
      async checkUpdate(btn) {
        const st = $('#update-status');
        btn.disabled = true; btn.textContent = 'Checking…';
        const v = await this.remoteVersion();
        btn.disabled = false; btn.textContent = 'Check for updates';
        if (v == null) { if (st) st.textContent = 'Could not check — are you online?'; return; }
        if (v > APP_VERSION) {
          if (st) st.textContent = 'Updating to version ' + v + '…';
          try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
          return location.reload();
        }
        if (st) st.textContent = "You're up to date ✓";
      },
      showUpdateBar() {
        if ($('.update-bar')) return;
        const bar = document.createElement('div');
        bar.className = 'update-bar';
        bar.innerHTML = '<span>A new version is ready</span><button data-action="do-update">Update</button>';
        document.body.appendChild(bar);
      },

      async checkOffline() {
        const set = (ok, msg) => { const t = $('#offline-status'), d = $('#offline-dot'); if (!t) return; t.textContent = msg; d.style.background = ok ? 'var(--ok)' : 'var(--bad)'; };
        if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return set(false, 'Only works from the web link (8glitchh.github.io)');
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          const keys = window.caches ? await caches.keys() : [];
          if (reg && reg.active && keys.length) set(true, 'Ready — you can use it without internet');
          else set(false, 'Not ready yet — keep it open with internet for a few seconds');
        } catch (e) { set(false, 'Not available in this browser mode'); }
      },

      exportProgress() {
        const blob = new Blob([JSON.stringify(Store.d, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `glitch-deutsch-progress-${dayKey()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      },

      importProgress(file) {
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (!d || typeof d.learnedWords !== 'object') throw 0;
            localStorage.setItem(Store.KEY, JSON.stringify(d));
            Store.load(); this.migrateWords(); this.closeSheet(); this.applyTheme(); this.forgetSessions(); this.s = {}; this.render();
            this.toast('Progress imported');
          } catch (e) { alert('That file is not a Glitch Deutsch backup.'); }
        };
        r.readAsText(file);
      },

      /* ---------- Shared bits ---------- */
      wordExtra(w) {
        const bits = [];
        if (w.plural) bits.push(`Pl. <b>${esc(w.plural)}</b>`);
        if (w.forms) bits.push(esc(w.forms));
        if (w.note) bits.push(esc(w.note));
        return bits.join(' · ');
      },
      deHtml(w) {
        return w.article ? `<span class="art">${w.article}</span> ${esc(w.noun)}` : esc(w.de);
      },
      speakBtn(text) {
        const off = Speech.ready && !Speech.canSpeak;
        return `<button class="speak ${off ? 'off' : ''}" data-action="speak" data-text="${esc(text)}" aria-label="${off ? 'German voice not available - how to add it' : 'Listen'}" title="${off ? 'No German voice on this device - tap to see how to add one' : 'Listen'}">${icon('speaker')}</button>`;
      },
      updateSpeakButtons() {
        const off = Speech.ready && !Speech.canSpeak;
        document.querySelectorAll('.speak').forEach(b => {
          b.classList.toggle('off', off);
          b.title = off ? 'No German voice on this device - tap to see how to add one' : 'Listen';
          b.setAttribute('aria-label', off ? 'German voice not available - how to add it' : 'Listen');
        });
        const st = $('#voice-status'); if (st) this.openSettings();
      },

      // How to add a German voice, for the device in hand (other devices one tap away).
      openVoiceHelp(os) {
        const ua = navigator.userAgent;
        const detected = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios'
          : /android/i.test(ua) ? 'android' : /Windows/i.test(ua) ? 'windows' : /Macintosh/.test(ua) ? 'mac' : 'windows';
        os = os || detected;
        const isFirefox = /firefox/i.test(ua);
        const li = (n, html) => `<li><span class="num">${n}</span><span>${html}</span></li>`;
        const steps = {
          ios: `<ol class="inst-list">
              ${li(1, 'Open <b>Settings</b> → <b>Accessibility</b> → <b>Spoken Content</b> → <b>Voices</b>.')}
              ${li(2, 'Tap <b>German</b> and pick a voice, e.g. <b>Anna</b>. Choose the normal one, not <b>Enhanced</b> or <b>Premium</b>, which are much bigger downloads.')}
              ${li(3, 'Wait for it to download, then fully close the app and open it again.')}
            </ol>`,
          android: `<ol class="inst-list">
              ${li(1, 'Open <b>Settings</b> and search for <b>Text-to-speech</b>.')}
              ${li(2, 'Set the engine to <b>Speech Services by Google</b>, then tap its ⚙ → <b>Install voice data</b>.')}
              ${li(3, 'Pick <b>German (Germany)</b> and download it, then close and reopen the app.')}
            </ol>`,
          windows: `${isFirefox && detected === 'windows' ? `<div class="inst-note" style="margin:0 0 10px">Easiest: open this app in <b>Chrome</b> or <b>Edge</b>. They have German voices built in, so it works straight away.</div>` : ''}
            <ol class="inst-list">
              ${li(1, 'Open <b>Settings</b> → <b>Time &amp; language</b> → <b>Speech</b>.')}
              ${li(2, 'Under <b>Manage voices</b>, tap <b>Add voices</b>, pick <b>German (Germany)</b> and add it.')}
              ${li(3, 'Close the browser completely and open the app again.')}
            </ol>`,
          mac: `<ol class="inst-list">
              ${li(1, 'Open <b>System Settings</b> → <b>Accessibility</b> → <b>Spoken Content</b>.')}
              ${li(2, 'Next to <b>System voice</b>, open <b>Manage Voices</b>, find <b>German</b> and download a voice.')}
              ${li(3, 'Close the browser completely and open the app again. (Chrome also has a German voice built in.)')}
            </ol>`,
        };
        const tab = (id, label) => `<button class="${os === id ? 'on' : ''}" data-action="voice-os" data-os="${id}">${label}</button>`;
        this.openSheet(`
          <div class="sheet-head"><h3>Add a German voice</h3><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
          <div class="sheet-body">
            <p class="inst-intro">${Speech.ok ? "This device doesn't have a German voice yet, so words can't be read aloud. Adding one is free, takes a minute, and then works offline." : "This browser can't read text aloud. Try Chrome, Edge or Safari."}</p>
            ${Speech.ok ? `<div class="inst-tabs"><div class="seg">${tab('ios', 'iPhone')}${tab('android', 'Android')}${tab('windows', 'Windows')}${tab('mac', 'Mac')}</div></div>${steps[os]}` : ''}
          </div>`);
      },
      emptyState(msg) { return `<div class="empty">${msg}</div>`; },
      // In My Words the wrong answers come from each word's own chapter, so far fewer saved words are enough.
      minWords(n) { return this.level === 'MY' ? (n >= 4 ? 1 : 2) : n; },
      needMsg(n, what) {
        const m = this.minWords(n);
        return this.level === 'MY' ? `Save at least ${m} words to use ${what}.` : `This part needs at least ${m} words for ${what}.`;
      },
      distractors(w, n, field, pool) {
        pool = (pool || (this.level === 'MY' && w.L ? this.words(w.L, w.ch) : this.words())).filter(x => x[field] !== w[field]);
        const same = pool.filter(x => !!x.article === !!w.article);
        const out = pick(same.length >= n ? same : pool, n).map(x => x[field]);
        return [...new Set(out)];
      },
      recordBest(key, val, higherIsBetter = true) {
        const k = this.bestKey(key), prev = Store.d.best[k];
        const better = prev == null || (higherIsBetter ? val > prev : val < prev);
        if (better) { Store.d.best[k] = val; Store.save(); }
        return { prev, better };
      },
      getBest(key) { return Store.d.best[this.bestKey(key)]; },
      bestKey(key) { return `${this.chKey()}${this.part ? '_p' + this.part : ''}_${key}`; },

      /* ================= 1. Flashcards ================= */
      buildDeck() {
        const s = this.s;
        let list = this.pool();
        if (s.filter === 'hard') list = list.filter(w => Store.status(w.de) === 'hard');
        if (s.filter === 'new') list = list.filter(w => Store.status(w.de) === 'new');
        if (s.shuffled) list = shuffle(list);
        Object.assign(s, { deck: list, i: 0, flipped: false, got: 0, again: 0, againList: [], skipped: [], answers: {}, hist: [] });
      },

      renderCards(p) {
        const s = this.s;
        if (!s.deck) { s.filter = s.filter || 'all'; s.shuffled = !!s.shuffled; this.buildDeck(); }
        this.saveCards();
        const dir = Store.d.settings.dir;
        const c = this.countList(this.pool());
        const head = `
          <div class="panel-head">
            <div class="seg" role="tablist">
              <button class="${s.filter === 'all' ? 'on' : ''}" data-action="c-filter" data-f="all">All ${c.total}</button>
              <button class="${s.filter === 'new' ? 'on' : ''}" data-action="c-filter" data-f="new">New ${c.fresh}</button>
              <button class="${s.filter === 'hard' ? 'on' : ''}" data-action="c-filter" data-f="hard">Learning ${c.hard}</button>
            </div>
            <div class="btn-row">
              <button class="btn btn-sm ${s.shuffled ? 'btn-primary' : ''}" data-action="c-shuffle" title="Mix the cards into a random order">${icon('shuffle')} ${s.shuffled ? 'Shuffled' : 'Shuffle'}</button>
              <button class="btn btn-sm" data-action="c-dir" title="Show German first or English first">${icon('swap')} ${dir === 'de-en' ? 'DE → EN' : 'EN → DE'}</button>
            </div>
          </div>`;

        if (!s.deck.length) {
          const msg = s.filter === 'hard'
            ? `<div class="summary"><div class="big">🎉</div><h2>Nothing left to learn</h2><p>No words in ${this.poolName()} are marked “still learning”.</p><button class="btn btn-primary" data-action="c-filter" data-f="all">Study all words</button></div>`
            : s.filter === 'new'
            ? `<div class="summary"><div class="big">✨</div><h2>No new words left</h2><p>You’ve seen every word in ${this.poolName()}.</p><button class="btn btn-primary" data-action="c-filter" data-f="all">Review all words</button></div>`
            : this.emptyState('No vocabulary in this chapter.');
          return p.innerHTML = head + msg;
        }

        if (s.i >= s.deck.length) {
          const perfect = s.again === 0;
          return p.innerHTML = head + `
            <div class="summary">
              <div class="big">${perfect ? '🏆' : '💪'}</div>
              <h2>${perfect ? 'Perfect round!' : 'Round complete'}${this.part ? ' · Part ' + this.part : ''}</h2>
              <p>${perfect ? 'You knew every card.' : 'Go again with just the cards you missed.'}</p>
              ${this.part && this.part < this.partLists().length ? `<div class="next-part"><b>Part ${this.part} of ${this.partLists().length} done</b><span>This chapter has ${this.partLists().length - this.part} more part${this.partLists().length - this.part === 1 ? '' : 's'} to go.</span></div>` : this.part ? `<div class="next-part"><b>That was the last part 🎉</b><span>You've been through all ${this.partLists().length} parts of this chapter.</span></div>` : ''}
              <div class="stat-row">
                <div class="stat"><b style="color:var(--ok)">${s.got}</b><span>Got it</span></div>
                <div class="stat"><b style="color:var(--bad)">${s.again}</b><span>Still learning</span></div>
              </div>
              <div class="btn-row">
                ${s.again ? `<button class="btn btn-primary" data-action="c-again">${icon('restart')} Go over ${s.again} again</button>` : ''}
                <button class="btn" data-action="c-restart">Start over</button>
                ${this.part && this.part < this.partLists().length ? `<button class="btn ${s.again ? '' : 'btn-primary'}" data-action="set-part" data-p="${this.part + 1}">Next: Part ${this.part + 1} ${icon('right')}</button>` : ''}
              </div>
            </div>`;
        }

        const w = s.deck[s.i];
        const deFace = `
          <div class="fface-mid">
            ${w.article ? `<span class="gtag">${{ der: 'masculine', die: 'feminine', das: 'neuter' }[w.article]}</span>` : ''}
            <div class="fword">${this.deHtml(w)}</div>
            ${this.wordExtra(w) ? `<div class="fsub">${this.wordExtra(w)}</div>` : ''}
          </div>`;
        const enFace = `<div class="fface-mid"><div class="fword">${esc(w.en)}</div></div>`;
        const [front, back] = dir === 'de-en' ? [deFace, enFace] : [enFace, deFace];
        const [fl, bl] = dir === 'de-en' ? ['German', 'English'] : ['English', 'German'];
        const status = Store.status(w.de);

        p.innerHTML = head + `
          <div class="deck-bar"><i style="width:${s.i / s.deck.length * 100}%"></i></div>
          <div class="card-stage">
            <span class="swipe-tag l">${icon('x')} STILL LEARNING</span><span class="swipe-tag r">${icon('check')} GOT IT</span>
            <div class="fcard ${s.flipped ? 'flipped' : ''} ${gClass(w)}" id="fcard" data-action="c-flip">
              <div class="fface ${dir === 'de-en' && w.article ? 'g' : ''}">
                <div class="fface-top"><span>${fl}</span><span class="ft-r">${dir === 'de-en' ? this.speakBtn(w.de) : `<span>${status === 'hard' ? '⚠ still learning' : status === 'learned' ? '✓ mastered' : ''}</span>`}${this.starBtn(w)}</span></div>
                ${front}
                <div class="fhint">Tap to reveal</div>
              </div>
              <div class="fface back ${dir === 'en-de' && w.article ? 'g' : ''}">
                <div class="fface-top"><span>${bl}</span><span class="ft-r">${dir === 'en-de' ? this.speakBtn(w.de) : ''}${this.starBtn(w)}</span></div>
                ${back}
                <div class="fhint">Did you know it?</div>
              </div>
            </div>
          </div>
          <div class="rate">
            <button class="btn btn-lg btn-bad" data-action="c-rate" data-r="hard">${icon('x')} Still learning</button>
            <button class="btn btn-lg btn-ok" data-action="c-rate" data-r="learned">${icon('check')} Got it</button>
          </div>
          <div class="deck-nav">
            <button class="btn btn-sm btn-ghost" data-action="c-step" data-d="-1" ${s.i === 0 && !(s.hist || []).length ? 'disabled style="opacity:.4"' : ''}>${icon('left')} Back</button>
            <span class="deck-mid">
              <span class="muted small" style="font-variant-numeric:tabular-nums">${s.i + 1} / ${s.deck.length}${this.part ? ' · Part ' + this.part + ' of ' + this.partLists().length : ''}</span>
              ${(s.skipped || []).length ? `<span class="small" style="color:var(--accent);font-weight:700">${s.skipped.length} skipped, coming back</span>` : ''}
              <button class="btn btn-sm btn-ghost" data-action="c-reset-open" title="Clear this part's marks and start it again from the first card">${icon('restart')} Restart</button>
            </span>
            <button class="btn btn-sm btn-ghost" data-action="c-step" data-d="1" title="Not now: this card comes back at the end">Skip ${icon('right')}</button>
          </div>
          <div class="kbd-hint"><kbd>Space</kbd> flip · <kbd>←</kbd> still learning · <kbd>→</kbd> got it · <kbd>S</kbd> speak · <kbd>F</kbd> save · or swipe the card</div>`;

        this.attachSwipe($('#fcard'));
        this.flyIn();
        if (Store.d.settings.autoSpeak && (dir === 'de-en' ? !s.flipped : s.flipped)) Speech.say(w.de);
      },

      flipCard() {
        const s = this.s, el = $('#fcard');
        if (!el) return;
        s.flipped = !s.flipped;
        el.classList.toggle('flipped', s.flipped);
        if (s.flipped && Store.d.settings.autoSpeak && Store.d.settings.dir === 'en-de') Speech.say(s.deck[s.i].de);
      },

      rateCard(r) {
        const s = this.s, w = s.deck[s.i];
        if (!w) return;
        if (this.animating) { this.queued = () => this.rateCard(r); return; }
        Store.setStatus(w.de, r);
        s.answers = s.answers || {};
        const prev = s.answers[w.de];
        if (prev === 'learned') s.got--;
        if (prev === 'hard') { s.again--; s.againList = s.againList.filter(x => x.de !== w.de); }
        s.answers[w.de] = r;
        if (r === 'learned') s.got++; else { s.again++; s.againList.push(w); }
        if (s.skipped) s.skipped = s.skipped.filter(k => k !== w.de);
        // "Got it" leaves to the right, "Still learning" to the left; the next card comes in from the other side.
        this.flyOut(r === 'learned' ? 1 : -1, () => { s.i++; (s.hist = s.hist || []).push(1); s.flipped = false; this.refreshStats(); this.renderCards($('#panel')); }, true);
      },

      // Colour wash + badge for a drag of dx pixels (0 = none). Full strength at ~110 px.
      swipeFx(el, tagL, tagR, dx) {
        const p = Math.min(1, Math.abs(dx) / 110);
        // Glow from the side you swipe towards: green from the right, red from the left. It gets
        // stronger and spreads further into the card the farther you drag.
        if (dx) el.style.setProperty('--sw-bg', dx > 0
          ? `linear-gradient(to left, var(--ok) 0%, transparent ${20 + 45 * p}%)`
          : `linear-gradient(to right, var(--bad) 0%, transparent ${20 + 45 * p}%)`);
        el.style.setProperty('--sw-a', p);
        const show = (tag, on, side) => {
          if (!tag) return;
          const q = on ? p : 0;
          tag.style.opacity = Math.min(1, q * 1.25);
          tag.style.setProperty('--tag-s', .75 + .3 * q);
          tag.style.setProperty('--tag-x', (side * (1 - q) * 14) + 'px');   // glides in from its own edge
        };
        show(tagR, dx > 0, 1); show(tagL, dx < 0, -1);
      },

      flyOut(dir, then, fx) {
        const s = this.s, el = $('#fcard');
        if (!el) return then();
        this.animating = true;
        el.classList.remove('dragging');
        if (fx) {
          const stage = el.parentElement;
          const tl = stage.querySelector('.swipe-tag.l'), tr = stage.querySelector('.swipe-tag.r');
          this.swipeFx(el, tl, tr, dir * 120);
          setTimeout(() => { [tl, tr].forEach(t => { if (t) { t.style.opacity = 0; t.style.setProperty('--tag-s', .9); } }); }, 90);
        }
        el.style.transition = 'transform .28s cubic-bezier(.4,0,1,1), opacity .28s ease-in';
        el.style.transform = `translateX(${dir * 135}%) rotate(${dir * 18}deg)${s.flipped ? ' rotateY(180deg)' : ''}`;
        el.style.opacity = '0';
        setTimeout(() => {
          this.animating = false;
          const queued = this.queued; this.queued = null;
          if (this.s !== s || this.mode !== 'cards') return;  // left flashcards meanwhile
          this.enterFrom = -dir;
          then();
          if (queued) queued();
        }, 230);
      },

      flyIn() {
        const el = $('#fcard'), from = this.enterFrom;
        this.enterFrom = 0;
        if (!el || !from) return;
        el.style.transition = 'none';
        el.style.transform = `translateX(${from * 115}%) rotate(${from * 8}deg)`;
        el.style.opacity = '0';
        el.offsetWidth; // start from off-screen
        el.style.transition = 'transform .4s cubic-bezier(.2,.9,.25,1.05), opacity .25s ease-out';
        el.style.transform = '';
        el.style.opacity = '';
        setTimeout(() => { if (el.isConnected) el.style.transition = ''; }, 420);
      },

      attachSwipe(el) {
        // Follow the finger via window listeners (no pointer capture): on Android a capture could
        // linger after the swipe and swallow the next tap on a button.
        let x0 = 0, y0 = 0, dx = 0, moved = false, pid = null;
        const stage = el.parentElement, tagL = stage.querySelector('.swipe-tag.l'), tagR = stage.querySelector('.swipe-tag.r');
        const stop = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', end);
          window.removeEventListener('pointercancel', end);
          pid = null;
        };
        const move = e => {
          if (e.pointerId !== pid) return;
          dx = e.clientX - x0;
          if (!moved && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(e.clientY - y0)) { moved = true; el.classList.add('dragging'); stage.classList.add('dragging'); }
          if (moved) {
            const flip = this.s.flipped ? ' rotateY(180deg)' : '';
            el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)${flip}`;
            this.swipeFx(el, tagL, tagR, dx);
          }
        };
        const end = e => {
          if (e.pointerId !== pid) return;
          stop();
          if (!moved) return;
          try { const sel = window.getSelection && window.getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges(); } catch (_) {}
          el.classList.remove('dragging'); stage.classList.remove('dragging');
          el.dataset.swiped = '1'; setTimeout(() => delete el.dataset.swiped, 50);
          if (e.type !== 'pointercancel' && Math.abs(dx) > 90) return this.rateCard(dx > 0 ? 'learned' : 'hard');
          el.style.transform = ''; this.swipeFx(el, tagL, tagR, 0);   // glide back, colour fades out
        };
        el.addEventListener('pointerdown', e => {
          if (e.target.closest('.speak, .star') || pid !== null) return;
          pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false;
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', end);
          window.addEventListener('pointercancel', end);
        });
      },

      on_cards(a, el) {
        const s = this.s;
        if (a === 'c-flip') { if (el.dataset.swiped) return; return this.flipCard(); }
        if (a === 'c-rate') return this.rateCard(el.dataset.r);
        if (a === 'c-step') {
          const d = +el.dataset.d;
          if (this.animating) { this.queued = () => this.on_cards(a, el); return; }
          s.hist = s.hist || [];
          if (d < 0 && s.i === 0 && !s.hist.length) return;
          if (d > 0) {
            if ((s.answers || {})[s.deck[s.i].de]) return this.flyOut(-1, () => { s.i++; s.hist.push(1); s.flipped = false; this.renderCards($('#panel')); });
            if (s.i >= s.deck.length - 1) return this.toast('Last card left: choose Got it or Still learning to finish');
            return this.flyOut(-1, () => {
              const deck = s.deck.slice();   // a copy: the deck can be the chapter's own word list
              const [w] = deck.splice(s.i, 1);
              deck.push(w);
              s.deck = deck;
              s.skipped = [...new Set([...(s.skipped || []), w.de])];
              s.hist.push(w.de);
              s.flipped = false;
              this.renderCards($('#panel'));
            });
          }
          return this.flyOut(1, () => {
            const last = s.hist.pop();
            if (typeof last === 'string') {   // undo a skip: that card comes back right here
              const deck = s.deck.slice(), at = deck.findIndex((w, n) => n >= s.i && w.de === last);
              if (at >= 0) { const [w] = deck.splice(at, 1); deck.splice(s.i, 0, w); s.deck = deck; }
              s.skipped = (s.skipped || []).filter(k => k !== last);
            } else s.i = Math.max(0, s.i - 1);
            s.flipped = false;
            this.renderCards($('#panel'));
          });
        }
        if (a === 'c-filter') {
          const f = el.dataset.f;
          if (f === s.filter) return;
          if (s.filter === 'all') s.savedAll = { deck: s.deck, i: s.i, got: s.got, again: s.again, againList: s.againList, shuffled: s.shuffled, skipped: s.skipped || [], answers: s.answers || {}, hist: s.hist || [] };
          s.filter = f;
          if (f === 'all' && s.savedAll && s.savedAll.shuffled === s.shuffled) { Object.assign(s, s.savedAll, { flipped: false }); s.savedAll = null; }
          else this.buildDeck();
          return this.renderCards($('#panel'));
        }
        if (a === 'c-shuffle') { s.shuffled = !s.shuffled; s.savedAll = null; this.buildDeck(); this.toast(s.shuffled ? 'Cards shuffled into random order' : 'Cards back in normal order'); return this.renderCards($('#panel')); }
        if (a === 'c-dir') { Store.d.settings.dir = Store.d.settings.dir === 'de-en' ? 'en-de' : 'de-en'; Store.save(); s.flipped = false; this.toast(Store.d.settings.dir === 'de-en' ? 'German first, then English' : 'English first, then German'); return this.renderCards($('#panel')); }
        if (a === 'c-restart') { s.savedAll = null; this.buildDeck(); return this.renderCards($('#panel')); }
        if (a === 'c-reset-open') {
          for (const w of this.pool()) { delete Store.d.learnedWords[w.de]; delete Store.d.difficultWords[w.de]; }
          Store.save();
          s.filter = 'all'; s.savedAll = null;
          this.buildDeck();
          this.refreshStats();
          this.toast((this.part ? 'Part ' + this.part : 'Chapter') + ' restarted');
          return this.renderCards($('#panel'));
        }
        if (a === 'c-again') { const list = s.shuffled ? shuffle(s.againList) : s.againList; Object.assign(s, { deck: list, i: 0, flipped: false, got: 0, again: 0, againList: [], skipped: [], answers: {}, hist: [] }); return this.renderCards($('#panel')); }
      },
      key_cards(e, typing) {
        if (typing || !this.s.deck || this.s.i >= this.s.deck.length) return;
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); this.flipCard(); }
        else if (e.key === 'ArrowLeft' || e.key === '1') this.rateCard('hard');
        else if (e.key === 'ArrowRight' || e.key === '2') this.rateCard('learned');
        else if (e.key.toLowerCase() === 's') Speech.say(this.s.deck[this.s.i].de);
        else if (e.key.toLowerCase() === 'f') { const w = this.s.deck[this.s.i]; this.toggleStar(w.de, w.L, w.ch); }
      },

      /* ================= 2. Quiz (multiple choice) ================= */
      renderQuiz(p) {
        const s = this.s, list = this.pool();
        if (list.length < this.minWords(4)) return p.innerHTML = this.emptyState(this.needMsg(4, 'a quiz'));
        if (!s.qs) {
          const src = s.retry || pick(list, Math.min(10, list.length));
          s.qs = src.map(w => {
            const toEn = Math.random() < 0.5;
            const field = toEn ? 'en' : 'de';
            return { w, toEn, answer: w[field], opts: shuffle([w[field], ...this.distractors(w, 3, field)]) };
          });
          Object.assign(s, { i: 0, score: 0, missed: [], answered: false, retry: null });
        }
        if (s.i >= s.qs.length) {
          const pctv = Math.round(s.score / s.qs.length * 100);
          const { better, prev } = this.recordBest('quiz', pctv);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${pctv === 100 ? '🏆' : pctv >= 70 ? '🎯' : '📚'}</div>
              <h2>${s.score} / ${s.qs.length} correct</h2>
              <p>${better && prev != null ? 'New personal best for this chapter!' : pctv === 100 ? 'Flawless.' : 'Missed words were added to “Still learning”.'}</p>
              ${s.missed.length ? `<div class="wlist" style="text-align:left;margin:0 auto 22px;max-width:460px">${s.missed.map(w => `
                <div class="wrow ${gClass(w)}"><span class="bar"></span><div><div class="de">${this.deHtml(w)}</div><div class="en">${esc(w.en)}</div></div><span></span></div>`).join('')}</div>` : ''}
              <div class="btn-row">
                ${s.missed.length ? `<button class="btn btn-primary" data-action="q-retry">${icon('restart')} Retry ${s.missed.length} missed</button>` : ''}
                <button class="btn" data-action="q-new">New quiz</button>
              </div>
            </div>`;
        }
        const q = s.qs[s.i];
        p.innerHTML = `
          <div class="q-meta"><span>Question ${s.i + 1} / ${s.qs.length}</span><span style="color:var(--ok)">${s.score} correct</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.qs.length * 100}%"></i></div>
          <div class="q-prompt">
            <div class="q-label">${q.toEn ? 'What does this mean?' : 'How do you say this in German?'}</div>
            <div class="q-word ${gClass(q.w)}">${q.toEn ? this.deHtml(q.w) + this.speakBtn(q.w.de) : esc(q.w.en)}</div>
          </div>
          <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-action="q-ans" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
          <div id="fb"></div>
          <div class="kbd-hint"><kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>Enter</kbd> next</div>`;
      },
      answerQuiz(i) {
        const s = this.s, q = s.qs[s.i];
        if (s.answered || !q) return;
        s.answered = true;
        const btns = [...document.querySelectorAll('.opt')];
        btns.forEach(b => b.disabled = true);
        const correct = q.opts[i] === q.answer;
        btns.forEach((b, j) => { if (q.opts[j] === q.answer) b.classList.add('correct'); });
        if (correct) s.score++;
        else { btns[i].classList.add('wrong'); s.missed.push(q.w); Store.setStatus(q.w.de, 'hard'); this.refreshStats(); }
        $('#fb').innerHTML = `<div class="feedback ${correct ? 'ok' : 'bad'}">
          <span class="fb-text">${correct ? 'Correct!' : 'Not quite'}<small>${this.deHtml(q.w)} = ${esc(q.w.en)}</small></span>
          <button class="btn btn-sm btn-primary" data-action="q-next">Next ${icon('right')}</button></div>`;
        if (correct) setTimeout(() => { if (this.s === s && s.answered && s.qs[s.i] === q) this.nextQuiz(); }, 900);
      },
      nextQuiz() { const s = this.s; s.i++; s.answered = false; this.renderQuiz($('#panel')); },
      on_quiz(a, el) {
        if (a === 'q-ans') return this.answerQuiz(+el.dataset.i);
        if (a === 'q-next') return this.nextQuiz();
        if (a === 'q-retry') { const m = this.s.missed; this.s = { retry: shuffle(m) }; return this.renderQuiz($('#panel')); }
        if (a === 'q-new') { this.s = {}; return this.renderQuiz($('#panel')); }
      },
      key_quiz(e, typing) {
        if (typing || !this.s.qs) return;
        if (/^[1-4]$/.test(e.key)) this.answerQuiz(+e.key - 1);
        else if (e.key === 'Enter' && this.s.answered) this.nextQuiz();
      },

      /* ================= 3. Write (type the German) ================= */
      norm(t) { return t.toLowerCase().replace(/[.,!?¿¡;:"“”„]/g, '').replace(/\s+/g, ' ').trim(); },
      fold(t) { return this.norm(t).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss'); },
      renderType(p) {
        const s = this.s, list = this.pool();
        if (!list.length) return p.innerHTML = this.emptyState('No vocabulary in this chapter.');
        if (!s.qs) Object.assign(s, { qs: s.retry || pick(list, Math.min(10, list.length)), i: 0, score: 0, missed: [], done: false, retry: null });
        if (s.i >= s.qs.length) {
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${s.score === s.qs.length ? '🏆' : '✍️'}</div>
              <h2>${s.score} / ${s.qs.length} spelled right</h2>
              <p>Correct answers count as mastered; mistakes go to “Still learning”.</p>
              <div class="btn-row">
                ${s.missed.length ? `<button class="btn btn-primary" data-action="t-retry">${icon('restart')} Retry ${s.missed.length} missed</button>` : ''}
                <button class="btn" data-action="t-new">New round</button>
              </div>
            </div>`;
        }
        const w = s.qs[s.i];
        p.innerHTML = `
          <div class="q-meta"><span>Word ${s.i + 1} / ${s.qs.length}</span><span style="color:var(--ok)">${s.score} correct</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.qs.length * 100}%"></i></div>
          <div class="q-prompt">
            <div class="q-label">Write in German${w.article ? ' — include the article' : ''}</div>
            <div class="q-word">${esc(w.en)}</div>
            ${w.note ? `<div class="muted small" style="margin-top:6px">(${esc(w.note)})</div>` : ''}
          </div>
          <form class="type-box" id="type-form" autocomplete="off">
            <input class="type-input" id="type-in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type here…" aria-label="Your answer">
            <button class="btn btn-primary btn-lg" type="submit" id="type-go">Check</button>
          </form>
          <div class="umlauts">${['ä', 'ö', 'ü', 'ß'].map(c => `<button type="button" data-action="t-char" data-c="${c}">${c}</button>`).join('')}</div>
          <div id="fb"></div>
          <div class="kbd-hint"><kbd>Enter</kbd> check / next · leave empty and press Enter to reveal</div>`;
        const inp = $('#type-in');
        $('#type-form').addEventListener('submit', e => { e.preventDefault(); s.done ? this.nextType() : this.checkType(); });
        setTimeout(() => inp.focus({ preventScroll: true }), 30);
      },
      checkType() {
        const s = this.s, w = s.qs[s.i], inp = $('#type-in');
        const val = inp.value;
        const alts = w.de.split(/\s*\/\s*/).concat(w.de);
        let result = 'bad';
        if (val.trim()) {
          if (alts.some(a => this.norm(a) === this.norm(val))) result = 'ok';
          else if (alts.some(a => this.fold(a) === this.fold(val))) result = 'ok-umlaut';
          else if (w.article && this.norm(val) === this.norm(w.noun)) result = 'no-article';
        }
        s.done = true;
        inp.readOnly = true;
        const good = result === 'ok' || result === 'ok-umlaut';
        inp.classList.add(good ? 'ok' : 'bad');
        if (good) { s.score++; Store.setStatus(w.de, 'learned'); }
        else if (result !== 'no-article') { s.missed.push(w); Store.setStatus(w.de, 'hard'); }
        else s.missed.push(w);
        this.refreshStats();
        const msg = {
          'ok': ['ok', 'Richtig!', ''],
          'ok-umlaut': ['ok', 'Correct — mind the spelling', `Exact form: ${esc(w.de)}`],
          'no-article': ['meh', `Almost — don't forget the article`, `<span class="${gClass(w)}">${this.deHtml(w)}</span>`],
          'bad': ['bad', val.trim() ? 'Not quite' : 'Answer', `<span class="${gClass(w)}">${this.deHtml(w)}</span>${w.plural ? ` · Pl. ${esc(w.plural)}` : ''}`],
        }[result];
        $('#type-go').textContent = 'Next';
        $('#fb').innerHTML = `<div class="feedback ${msg[0]}"><span class="fb-text">${msg[1]}${msg[2] ? `<small>${msg[2]}</small>` : ''}</span>${this.speakBtn(w.de)}</div>`;
        if (Store.d.settings.autoSpeak) Speech.say(w.de);
      },
      nextType() { const s = this.s; s.i++; s.done = false; this.renderType($('#panel')); },
      on_type(a, el) {
        if (a === 't-char') {
          const inp = $('#type-in'); if (!inp || inp.readOnly) return;
          const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? st;
          inp.value = inp.value.slice(0, st) + el.dataset.c + inp.value.slice(en);
          inp.focus(); inp.setSelectionRange(st + 1, st + 1); return;
        }
        if (a === 't-retry') { const m = this.s.missed; this.s = { retry: shuffle(m) }; return this.renderType($('#panel')); }
        if (a === 't-new') { this.s = {}; return this.renderType($('#panel')); }
      },
      key_type(e, typing) {
        if (!typing && e.key === 'Enter' && this.s.done) this.nextType();
      },

      /* ================= 4. der / die / das ================= */
      renderArticles(p) {
        const s = this.s;
        const nouns = this.pool().filter(w => w.article);
        if (nouns.length < 3) return p.innerHTML = this.emptyState((this.part ? 'This part' : 'This chapter') + ' has too few nouns for the article trainer.' + (this.part ? ' Try another part, or “All”.' : ''));
        if (!s.deck) Object.assign(s, { deck: shuffle(nouns), i: 0, score: 0, streak: 0, bestStreak: 0, answered: false });
        if (s.i >= s.deck.length) {
          const { better } = this.recordBest('articles', s.bestStreak);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${s.score === s.deck.length ? '🏆' : '🏷️'}</div>
              <h2>${s.score} / ${s.deck.length} articles right</h2>
              <p>Longest streak: <b>${s.bestStreak}</b>${better ? ' — new best!' : ''}</p>
              <button class="btn btn-primary" data-action="a-new">${icon('restart')} Play again</button>
            </div>`;
        }
        const w = s.deck[s.i];
        p.innerHTML = `
          <div class="q-meta"><span>${s.i + 1} / ${s.deck.length}</span><span>${s.streak > 1 ? `<span class="combo">${icon('flame')} ${s.streak} in a row</span>` : `<span style="color:var(--ok)">${s.score} correct</span>`}</span></div>
          <div class="deck-bar"><i style="width:${s.i / s.deck.length * 100}%"></i></div>
          <div class="q-prompt">
            <div class="q-label">Which article?</div>
            <div class="art-word"><span class="art-slot" id="art-slot">&nbsp;</span>${esc(w.noun)}</div>
            <div class="muted">${esc(w.en)}</div>
          </div>
          <div class="art-btns">
            ${['der', 'die', 'das'].map((a, i) => `<button class="art-btn gender-${a}" data-action="a-ans" data-a="${a}">${a}<small>${['masc.', 'fem.', 'neut.'][i]}</small></button>`).join('')}
          </div>
          <div id="fb"></div>
          <div class="kbd-hint"><kbd>1</kbd> der · <kbd>2</kbd> die · <kbd>3</kbd> das · <kbd>Enter</kbd> next</div>`;
      },
      answerArticle(a) {
        const s = this.s, w = s.deck[s.i];
        if (s.answered || !w) return;
        s.answered = true;
        const ok = a === w.article;
        document.querySelectorAll('.art-btn').forEach(b => {
          b.disabled = true;
          if (b.dataset.a === w.article) b.classList.add('correct');
          else if (b.dataset.a === a) b.classList.add('wrong');
        });
        const slot = $('#art-slot');
        slot.textContent = w.article; slot.className = `art-slot art gender-${w.article}`; slot.style.borderBottomStyle = 'solid';
        slot.style.borderColor = 'var(--g)';
        if (ok) { s.score++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); }
        else { s.streak = 0; Store.setStatus(w.de, 'hard'); this.refreshStats(); }
        if (ok) { Speech.ok && Store.d.settings.autoSpeak && Speech.say(w.de); setTimeout(() => { if (this.s === s && s.deck[s.i] === w) this.nextArticle(); }, 650); }
        else $('#fb').innerHTML = `<div class="feedback bad"><span class="fb-text">It's <span class="art gender-${w.article}">${w.article}</span> ${esc(w.noun)}${w.plural ? `<small>Plural: ${esc(w.plural)}</small>` : ''}</span><button class="btn btn-sm btn-primary" data-action="a-next">Next ${icon('right')}</button></div>`;
      },
      nextArticle() { const s = this.s; s.i++; s.answered = false; this.renderArticles($('#panel')); },
      on_articles(a, el) {
        if (a === 'a-ans') return this.answerArticle(el.dataset.a);
        if (a === 'a-next') return this.nextArticle();
        if (a === 'a-new') { this.s = {}; return this.renderArticles($('#panel')); }
      },
      key_articles(e, typing) {
        if (typing || !this.s.deck) return;
        const m = { '1': 'der', '2': 'die', '3': 'das', 'q': 'der', 'w': 'die', 'e': 'das' }[e.key.toLowerCase()];
        if (m) this.answerArticle(m);
        else if (e.key === 'Enter' && this.s.answered) this.nextArticle();
      },

      /* ================= 5. Match ================= */
      renderMatch(p) {
        const s = this.s, list = this.pool();
        if (list.length < this.minWords(3)) return p.innerHTML = this.emptyState(this.needMsg(3, 'matching'));
        if (!s.pairs) {
          const pairs = pick(list, Math.min(6, list.length));
          Object.assign(s, { pairs, left: shuffle(pairs.map((w, i) => ({ i, text: w.de }))), right: shuffle(pairs.map((w, i) => ({ i, text: w.en }))), sel: null, hits: new Set(), errors: 0, t0: null, time: 0 });
        }
        if (s.hits.size === s.pairs.length) {
          const { better, prev } = this.recordBest('match', s.time, false);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">⚡</div>
              <h2>All matched in ${s.time.toFixed(1)}s</h2>
              <p>${s.errors} mistake${s.errors === 1 ? '' : 's'}${better && prev != null ? ' · new best time!' : prev != null ? ` · best ${prev.toFixed(1)}s` : ''}</p>
              <button class="btn btn-primary" data-action="m-new">${icon('restart')} Next round</button>
            </div>`;
        }
        const best = this.getBest('match');
        const tile = (t, side) => `<button class="tile ${s.hits.has(t.i) ? 'hit' : ''} ${s.sel && s.sel.side === side && s.sel.i === t.i ? 'sel' : ''}" data-action="m-tile" data-side="${side}" data-i="${t.i}">${esc(t.text)}</button>`;
        p.innerHTML = `
          <div class="q-meta"><span>${s.hits.size} / ${s.pairs.length} pairs</span><span id="m-time" style="font-variant-numeric:tabular-nums">${best != null ? `Best ${best.toFixed(1)}s · ` : ''}${s.t0 ? ((Date.now() - s.t0) / 1000).toFixed(0) + 's' : 'Tap to start'}</span></div>
          <div class="match-grid">
            <div class="match-col">${s.left.map(t => tile(t, 'L')).join('')}</div>
            <div class="match-col">${s.right.map(t => tile(t, 'R')).join('')}</div>
          </div>

      on_match(a, el) {
        const s = this.s;

        if (a !== 'm-tile' || s.lock) return;
        const side = el.dataset.side, i = +el.dataset.i;
        if (s.hits.has(i)) return;
        if (!s.t0) { s.t0 = Date.now(); }
        if (!s.sel || s.sel.side === side) { s.sel = { side, i }; if (side === 'L') Speech.ok && Store.d.settings.autoSpeak && Speech.say(s.pairs[i].de); return this.renderMatch($('#panel')); }
        if (s.sel.i === i) {
          s.hits.add(i); s.sel = null;
          if (s.hits.size === s.pairs.length) s.time = (Date.now() - s.t0) / 1000;
          return this.renderMatch($('#panel'));
        }
        s.errors++;
        const other = document.querySelector(`.tile[data-side="${s.sel.side}"][data-i="${s.sel.i}"]`);
        el.classList.add('miss'); other && other.classList.replace('sel', 'miss');
        s.lock = true; s.sel = null;

      /* ================= 6. Sprint ================= */
      SPRINT_TIME: 60,
      renderSprint(p) {
        const s = this.s, list = this.pool();
        if (list.length < this.minWords(4)) return p.innerHTML = this.emptyState(this.needMsg(4, 'Sprint'));
        if (!s.phase) s.phase = 'intro';
        const best = this.getBest('sprint');
        if (s.phase === 'intro') {
          return p.innerHTML = `

              <div class="hero-icon">${icon('zap')}</div>

              ${best != null ? `<p class="small" style="margin-top:-10px">${icon('trophy')} Best in ${this.part ? 'this part' : 'this chapter'}: <b style="color:var(--accent)">${best}</b></p>` : ''}
              <button class="btn btn-primary btn-lg" data-action="s-start" style="padding:0 32px">Start ${icon('zap')}</button>
            </div>`;
        }
        if (s.phase === 'over') {
          const { better, prev } = this.recordBest('sprint', s.score);
          return p.innerHTML = `
            <div class="summary">
              <div class="big">${better && prev != null ? '🏆' : '⏱️'}</div>
              <h2>${s.score} correct</h2>
              <p>${better && prev != null ? `New record! (was ${prev})` : prev != null ? `Best: ${Math.max(prev, s.score)}` : 'First run recorded.'} · top combo ${s.maxCombo}</p>
              <button class="btn btn-primary" data-action="s-start">${icon('restart')} Go again</button>
            </div>`;
        }
        const q = s.q;
        p.innerHTML = `
          <div class="timer-bar ${s.left <= 10 ? 'low' : ''}"><i id="s-bar" style="width:${s.left / this.SPRINT_TIME * 100}%"></i></div>
          <div class="q-meta"><span id="s-left" style="font-variant-numeric:tabular-nums">${s.left}s</span><span>${s.combo > 1 ? `<span class="combo">×${s.combo} combo</span> · ` : ''}Score <b style="color:var(--text)">${s.score}</b></span></div>
          <div class="q-prompt"><div class="q-label">${q.toEn ? 'English?' : 'German?'}</div><div class="q-word ${gClass(q.w)}">${q.toEn ? this.deHtml(q.w) : esc(q.w.en)}</div></div>
          <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-action="s-ans" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
          <div class="kbd-hint"><kbd>1</kbd>–<kbd>4</kbd> answer</div>`;
        this.timers.push(setInterval(() => this.sprintTick(), 1000));
      },
      sprintQ() {
        const list = this.pool(), w = list[Math.floor(Math.random() * list.length)];
        const toEn = Math.random() < 0.5, f = toEn ? 'en' : 'de';
        return { w, toEn, answer: w[f], opts: shuffle([w[f], ...this.distractors(w, 3, f)]) };
      },
      sprintTick() {
        const s = this.s;
        if (s.phase !== 'run') return;
        s.left--;
        if (s.left <= 0) { s.phase = 'over'; this.touchAndRender(); return; }
        const bar = $('#s-bar'), lab = $('#s-left');
        if (bar) { bar.style.width = `${s.left / this.SPRINT_TIME * 100}%`; bar.parentElement.classList.toggle('low', s.left <= 10); }
        if (lab) lab.textContent = `${s.left}s`;
      },
      touchAndRender() { Store.touchStreak(); Store.save(); this.renderStreak(); this.renderSprint($('#panel')); },
      answerSprint(i) {
        const s = this.s;
        if (s.phase !== 'run' || s.lock) return;
        const ok = s.q.opts[i] === s.q.answer;
        const btn = document.querySelectorAll('.opt')[i];
        if (ok) { s.score++; s.combo++; s.maxCombo = Math.max(s.maxCombo, s.combo); btn.classList.add('correct'); }
        else {
          s.combo = 0; s.left = Math.max(0, s.left - 3); btn.classList.add('wrong');

        s.lock = true;
        setTimeout(() => {
          if (this.s !== s) return;
          s.lock = false;
          if (s.left <= 0) { s.phase = 'over'; return this.touchAndRender(); }
          s.q = this.sprintQ(); this.clearTimers(); this.renderSprint($('#panel'));

      },
      on_sprint(a, el) {
        if (a === 's-start') { this.s = { phase: 'run', left: this.SPRINT_TIME, score: 0, combo: 0, maxCombo: 0, q: this.sprintQ() }; return this.renderSprint($('#panel')); }

            <button class="btn btn-primary" data-action="x-new">${icon('restart')} Play again</button></div>`;
        }
        const q = s.qs[s.i];
        const words = q.de.replace(/[.?!]+$/, '').split(/\s+/);
        if (!s.order || s.order.q !== q) s.order = { q, idx: shuffle(words.map((_, i) => i)) };

        const cls = s.checked === true ? 'ok' : s.checked === false ? 'bad' : '';

          </div>
          <div class="pool">${s.order.idx.filter(i => !placedSet.has(i)).map(i => `<button class="wchip" data-action="x-place" data-i="${i}">${esc(words[i])}</button>`).join('')}</div>
          <div class="btn-row">

      },
      on_sentences(a, el) {
        const s = this.s, P = () => this.renderSentences($('#panel'));

        if (a === 'x-place') { s.placed.push(+el.dataset.i); return P(); }
        if (a === 'x-remove') { s.placed.splice(+el.dataset.k, 1); return P(); }
        if (a === 'x-clear') { s.placed = []; return P(); }
        if (a === 'x-check') {
          const built = s.placed.map(i => s.words[i]).join(' ').toLowerCase();
          s.checked = built === s.words.join(' ').toLowerCase();
          if (s.checked) s.score++;
          Store.touchStreak(); Store.save(); this.renderStreak();

        else rows = this.pool().map(w => ({ w }));
        const q = this.fold(s.q || '');
        if (q) rows = rows.filter(({ w }) => this.fold(w.de).includes(q) || w.en.toLowerCase().includes(s.q.toLowerCase().trim()));
        if (s.f !== 'all') rows = rows.filter(({ w }) => Store.status(w.de) === s.f);

        const shown = rows.slice(0, 300);

          </div>`;

      },

      key_words(e, typing) {

    // Offline support + updates (only works when served over https, e.g. GitHub Pages)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        const firstInstall = !navigator.serviceWorker.controller;
        // iPhone keeps home-screen apps suspended instead of reloading them,
        // so look for a newer version every time the app comes back on screen.
        const lookForUpdate = async () => {
          const v = await app.remoteVersion();
          if (v && v > APP_VERSION) {
            navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
            app.showUpdateBar();
          }
        };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lookForUpdate(); });
        setTimeout(lookForUpdate, 3000);
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
          const done = () => { if (firstInstall) app.toast('Ready to use offline'); };
          if (reg.active && !reg.installing) return;
          const w = reg.installing || reg.waiting;
          if (w) w.addEventListener('statechange', () => { if (w.state === 'activated') done(); });
        }).catch(() => {});
        // Ask the browser not to clear saved progress
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      });
    }
